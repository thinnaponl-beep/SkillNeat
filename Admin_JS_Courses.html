<script>
/* ==========================================
   3. ระบบจัดการบทเรียน (Lessons)
========================================== */

function filterSubCategories(selectedValue = '') {
    const mainCat = document.getElementById('lesson-main-category').value;
    const subCatSelect = document.getElementById('lesson-category');
    if(!subCatSelect) return;

    let html = '<option value="">-- ไม่ระบุหมวดย่อย --</option>';
    
    if(masterData && masterData.categories) {
        masterData.categories.forEach(cat => {
            if(cat.includes('|')) {
                const parts = cat.split('|');
                if(parts[0] === mainCat) {
                    html += `<option value="${escapeHtml(parts[1])}">${escapeHtml(parts[1])}</option>`;
                }
            } else if (mainCat === '') {
                html += `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`;
            }
        });
    }
    
    subCatSelect.innerHTML = html;
    if(selectedValue) subCatSelect.value = selectedValue;
}

function renderLessonsList() {
    const container = document.getElementById('admin-lessons-list');
    if (!container) return;

    const searchInput = document.getElementById('admin-lesson-search');
    const catFilter = document.getElementById('admin-lesson-category');
    const searchKw = searchInput ? searchInput.value.toLowerCase().trim() : '';
    const filterCat = catFilter ? catFilter.value : '';

    const filteredLessons = lessons.filter(function(lesson) {
        const matchKw = lesson.Title.toLowerCase().includes(searchKw);
        const matchCat = filterCat === '' || lesson.Category === filterCat || lesson.MainCategory === filterCat;
        return matchKw && matchCat;
    });

    if (filteredLessons.length === 0) {
        container.innerHTML = '<div class="text-center p-8 text-slate-400">ไม่พบคอร์สที่ค้นหา</div>';
        return;
    }

    let html = '';
    filteredLessons.forEach(function(lesson) {
        const isActiveStr = lesson.IsActive ? '<span class="text-[10px] bg-[#31c1d7]/10 text-[#31c1d7] px-2 py-0.5 rounded font-bold">เผยแพร่แล้ว</span>' : '<span class="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded font-bold">ซ่อน</span>';
        const isFeaturedStr = (lesson.IsFeatured === true || lesson.IsFeatured === 'TRUE' || String(lesson.IsFeatured).toLowerCase() === 'true') ? '<span class="text-[10px] bg-rose-100 text-rose-600 px-2 py-0.5 rounded font-bold ml-1.5 border border-rose-200">🔥 แนะนำ</span>' : '';
        
        // JAVIS ADDED: แสดงป้าย "แนะนำประจำหมวดหมู่" พร้อมโชว์ลำดับ (ถ้ามี)
        let isCatFeatStr = '';
        if (lesson.IsCategoryFeatured && String(lesson.IsCategoryFeatured) !== '0' && String(lesson.IsCategoryFeatured).toLowerCase() !== 'false') {
             let orderStr = parseInt(lesson.IsCategoryFeatured) > 0 ? ' #' + parseInt(lesson.IsCategoryFeatured) : '';
             isCatFeatStr = '<span class="text-[10px] bg-amber-100 text-amber-600 px-2 py-0.5 rounded font-bold ml-1.5 border border-amber-200">⭐ หมวดหมู่' + orderStr + '</span>';
        }
        
        const mainCatStr = lesson.MainCategory ? '<span class="text-[10px] border border-blue-200 text-blue-600 bg-blue-50 px-2 py-0.5 rounded font-bold ml-1.5">' + escapeHtml(lesson.MainCategory) + '</span>' : '';
        const categoryStr = lesson.Category ? '<span class="text-[10px] border border-[#31c1d7]/30 text-[#31c1d7] px-2 py-0.5 rounded font-bold ml-1.5">' + escapeHtml(lesson.Category) + '</span>' : '';
        
        let totalAvailableBN = 0;
        const lessonSections = sections.filter(function(s) { return s.LessonID === lesson.LessonID; });
        lessonSections.forEach(function(sec) {
            totalAvailableBN += parseInt(sec.VideoPoints) || 10;
            const hasQuiz = typeof quizzes !== 'undefined' && quizzes.some(function(q) { return q.SectionID === sec.SectionID; });
            if (sec.questionCount > 0 || hasQuiz) {
                totalAvailableBN += parseInt(sec.QuizPoints) || 50;
            }
        });
        const bnBadge = '<span class="text-[10px] border border-amber-200 text-amber-600 bg-amber-50 px-2 py-0.5 rounded font-bold ml-1.5 flex items-center gap-1 flex-shrink-0"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1.323l3.954 1.582 1.599-.8a1 1 0 01.894 1.79l-1.233.616 1.738 5.42a1 1 0 01-.285 1.05A3.989 3.989 0 0115 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.715-5.349L11 6.477V16h2a1 1 0 110 2H7a1 1 0 110-2h2V6.477L6.237 7.582l1.715 5.349a1 1 0 01-.285 1.05A3.989 3.989 0 015 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.738-5.42-1.233-.617a1 1 0 01.894-1.788l1.599.799L9 4.323V3a1 1 0 011-1z" clip-rule="evenodd"></path></svg> Max ' + new Intl.NumberFormat().format(totalAvailableBN) + ' BN</span>';
        
        let targetInfo = '';
        if(lesson.TargetEmails) {
            targetInfo = '<p class="text-[11px] text-indigo-500 mt-1 font-medium">👤 เฉพาะอีเมลที่ระบุ</p>';
        } else if (lesson.TargetDepartments) {
            let shortDept = lesson.TargetDepartments;
            if(shortDept.length > 25) shortDept = shortDept.substring(0, 25) + '...';
            targetInfo = '<p class="text-[11px] text-slate-500 mt-1 font-medium truncate">👥 ' + escapeHtml(shortDept) + '</p>';
        }

        html += '<div class="admin-list-item bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center cursor-pointer hover:border-[#31c1d7]/50 transition-colors ' + (activeLessonId === lesson.LessonID ? 'ring-2 ring-[#31c1d7]/50 bg-[#31c1d7]/5' : '') + '" onclick="selectLesson(\'' + lesson.LessonID + '\')">' +
            '<div class="flex-grow overflow-hidden">' +
            '<h4 class="font-bold text-slate-800 truncate text-sm">' + escapeHtml(lesson.Title) + '</h4>' +
            targetInfo +
            '<div class="mt-2 flex items-center flex-wrap gap-y-1.5">' +
            isActiveStr + isFeaturedStr + isCatFeatStr + mainCatStr + categoryStr + bnBadge +
            '</div>' +
            '</div>' +
            '<div class="flex space-x-1 ml-3 flex-shrink-0">' +
            '<button onclick="event.stopPropagation(); showCourseLearners(\'' + lesson.LessonID + '\')" class="p-1.5 text-blue-500 hover:bg-blue-50 rounded-lg transition-colors" title="ดูผู้เรียนที่เข้าเรียนคอร์สนี้">' +
            '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>' +
            '</button>' +
            '<button onclick="event.stopPropagation(); openLessonModal(\'' + lesson.LessonID + '\')" class="p-1.5 text-[#31c1d7] hover:bg-[#31c1d7]/10 rounded-lg transition-colors" title="แก้ไข">' +
            '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>' +
            '</button>' +
            '<button onclick="event.stopPropagation(); deleteLesson(\'' + lesson.LessonID + '\')" class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="ลบ">' +
            '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>' +
            '</button>' +
            '</div>' +
            '</div>';
    });
    container.innerHTML = html;
}

function selectLesson(lessonId) {
    activeLessonId = lessonId;
    activeSectionId = null; 
    renderLessonsList();
    renderSectionsList();
    renderQuizzesList();
}

/* ==========================================
   ระบบ Tags ค้นหาและคลิกเลือก (แผนก, ตำแหน่ง, อีเมล)
========================================== */
window.currentDeptTags = window.currentDeptTags || [];
window.currentPosTags = window.currentPosTags || [];
window.currentEmailTags = window.currentEmailTags || [];

function renderDeptTags() {
    const wrapper = document.getElementById('selected-dept-tags');
    if(!wrapper) return;
    wrapper.innerHTML = '';
    window.currentDeptTags.forEach(function(dept) {
        const tag = document.createElement('span');
        tag.className = 'inline-flex items-center px-2.5 py-1 rounded-md text-sm font-medium bg-[#31c1d7]/10 text-[#31c1d7] border border-[#31c1d7]/20 shadow-sm';
        tag.innerHTML = escapeHtml(dept) + '<button type="button" onclick="window.removeDeptTag(\'' + escapeHtml(dept) + '\')" class="ml-1.5 inline-flex text-[#31c1d7] hover:text-red-500 focus:outline-none"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>';
        wrapper.appendChild(tag);
    });
}
window.addDeptTag = function(dept) {
    if (dept && !window.currentDeptTags.includes(dept)) {
        if (dept === 'ทั้งหมด (All)') window.currentDeptTags = ['ทั้งหมด (All)'];
        else {
            window.currentDeptTags = window.currentDeptTags.filter(function(d) { return d !== 'ทั้งหมด (All)'; });
            window.currentDeptTags.push(dept);
        }
        renderDeptTags();
    }
    const input = document.getElementById('search-dept-input');
    if(input) { input.value = ''; input.focus(); }
    const sugBox = document.getElementById('dept-suggestions');
    if(sugBox) sugBox.classList.add('hidden');
};
window.removeDeptTag = function(dept) {
    window.currentDeptTags = window.currentDeptTags.filter(function(d) { return d !== dept; });
    renderDeptTags();
};

function renderPosTags() {
    const wrapper = document.getElementById('selected-pos-tags');
    if(!wrapper) return;
    wrapper.innerHTML = '';
    window.currentPosTags.forEach(function(pos) {
        const tag = document.createElement('span');
        tag.className = 'inline-flex items-center px-2.5 py-1 rounded-md text-sm font-medium bg-[#31c1d7]/10 text-[#31c1d7] border border-[#31c1d7]/20 shadow-sm';
        tag.innerHTML = escapeHtml(pos) + '<button type="button" onclick="window.removePosTag(\'' + escapeHtml(pos) + '\')" class="ml-1.5 inline-flex text-[#31c1d7] hover:text-red-500 focus:outline-none"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>';
        wrapper.appendChild(tag);
    });
}
window.addPosTag = function(pos) {
    if (pos && !window.currentPosTags.includes(pos)) {
        if (pos === 'ทั้งหมด (All)') window.currentPosTags = ['ทั้งหมด (All)'];
        else {
            window.currentPosTags = window.currentPosTags.filter(function(p) { return p !== 'ทั้งหมด (All)'; });
            window.currentPosTags.push(pos);
        }
        renderPosTags();
    }
    const input = document.getElementById('search-pos-input');
    if(input) { input.value = ''; input.focus(); }
    const sugBox = document.getElementById('pos-suggestions');
    if(sugBox) sugBox.classList.add('hidden');
};
window.removePosTag = function(pos) {
    window.currentPosTags = window.currentPosTags.filter(function(p) { return p !== pos; });
    renderPosTags();
};

function renderEmailTags() {
    const wrapper = document.getElementById('email-tags-wrapper');
    if(!wrapper) return;
    wrapper.innerHTML = '';
    window.currentEmailTags.forEach(function(email) {
        const tag = document.createElement('span');
        tag.className = 'inline-flex items-center px-2.5 py-1 rounded-md text-sm font-medium bg-indigo-100 text-indigo-700 border border-indigo-200 shadow-sm';
        tag.innerHTML = escapeHtml(email) + '<button type="button" onclick="window.removeEmailTag(\'' + escapeHtml(email) + '\')" class="ml-1.5 inline-flex text-indigo-500 hover:text-red-500 focus:outline-none"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>';
        wrapper.appendChild(tag);
    });
}
window.addEmailTag = function(emailStr) {
    const emails = emailStr.split(/[\s,]+/).map(function(s) { return s.trim().toLowerCase(); }).filter(Boolean);
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let hasInvalid = false;
    emails.forEach(function(email) {
        if (!window.currentEmailTags.includes(email)) {
            if (emailRegex.test(email)) window.currentEmailTags.push(email);
            else hasInvalid = true;
        }
    });
    if(hasInvalid) showAdminToast('ข้ามอีเมลรูปแบบไม่ถูกต้อง', 'warning');
    renderEmailTags();
    
    const emailInput = document.getElementById('lesson-email-input');
    if(emailInput) emailInput.value = '';
};
window.removeEmailTag = function(email) {
    window.currentEmailTags = window.currentEmailTags.filter(function(e) { return e !== email; });
    renderEmailTags();
};
window.selectEmailSuggestion = function(email) {
    window.addEmailTag(email);
    const input = document.getElementById('lesson-email-input');
    if(input) { input.value = ''; input.focus(); }
    const emailSuggestions = document.getElementById('email-suggestions');
    if(emailSuggestions) emailSuggestions.classList.add('hidden');
};

function renderSuggestions(val, list, container, funcName) {
    const query = val.trim().toLowerCase();
    let matches = list;
    if (query) {
        matches = list.filter(function(item) { return String(item).toLowerCase().includes(query); });
    }
    if (matches.length > 0) {
        let html = '';
        matches.forEach(function(m) {
            html += '<div class="px-4 py-2 hover:bg-[#31c1d7]/10 cursor-pointer text-sm font-medium text-slate-700 border-b border-slate-50 last:border-0 transition-colors" onmousedown="window.' + funcName + '(\'' + escapeJsString(m) + '\')">' + escapeHtml(m) + '</div>';
        });
        container.innerHTML = html;
        container.classList.remove('hidden');
    } else {
        container.innerHTML = '<div class="px-4 py-3 text-sm text-slate-400 text-center font-medium border-dashed border border-slate-200 m-2 rounded-xl">ไม่พบข้อมูล</div>';
        container.classList.remove('hidden');
    }
}

let lessonFormEventsInitialized = false;
function initLessonFormEvents() {
    if (lessonFormEventsInitialized) return;
    
    const deptList = (typeof masterData !== 'undefined' && masterData && masterData.departments) ? masterData.departments : [];
    const posList = (typeof masterData !== 'undefined' && masterData && masterData.positions) ? masterData.positions : [];
    const userList = (typeof users !== 'undefined') ? users : [];

    const deptInput = document.getElementById('search-dept-input');
    const deptSug = document.getElementById('dept-suggestions');
    if (deptInput && deptSug) {
        deptInput.addEventListener('focus', function() { renderSuggestions('', deptList, deptSug, 'addDeptTag'); });
        deptInput.addEventListener('input', function() { renderSuggestions(this.value, deptList, deptSug, 'addDeptTag'); });
        deptInput.addEventListener('blur', function() { setTimeout(function() { deptSug.classList.add('hidden'); }, 200); });
    }
    
    const posInput = document.getElementById('search-pos-input');
    const posSug = document.getElementById('pos-suggestions');
    if (posInput && posSug) {
        posInput.addEventListener('focus', function() { renderSuggestions('', posList, posSug, 'addPosTag'); });
        posInput.addEventListener('input', function() { renderSuggestions(this.value, posList, posSug, 'addPosTag'); });
        posInput.addEventListener('blur', function() { setTimeout(function() { posSug.classList.add('hidden'); }, 200); });
    }

    const emailInput = document.getElementById('lesson-email-input');
    const emailSuggestions = document.getElementById('email-suggestions');
    if (emailInput) {
        emailInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ',') { 
                e.preventDefault(); 
                if (this.value.trim() !== '') window.addEmailTag(this.value); 
                if(emailSuggestions) emailSuggestions.classList.add('hidden');
            }
            if (e.key === 'Backspace' && this.value === '' && window.currentEmailTags.length > 0) { 
                window.currentEmailTags.pop(); 
                renderEmailTags(); 
            }
        });
        
        emailInput.addEventListener('focus', function(e) {
            const matches = userList.slice(0, 10);
            if (matches.length > 0) {
                let html = '';
                matches.forEach(function(u) {
                    const name = u.FullName || u.Nickname || 'ไม่มีชื่อ';
                    html += '<div class="px-4 py-2.5 hover:bg-[#31c1d7]/10 cursor-pointer border-b border-slate-50 last:border-0 transition-colors" onmousedown="window.selectEmailSuggestion(\'' + escapeJsString(u.Email) + '\')">' +
                        '<div class="font-bold text-sm text-slate-700">' + escapeHtml(name) + '</div>' +
                        '<div class="text-xs text-slate-500">' + escapeHtml(u.Email) + '</div>' +
                    '</div>';
                });
                if(emailSuggestions) {
                    emailSuggestions.innerHTML = html;
                    emailSuggestions.classList.remove('hidden');
                }
            }
        });

        emailInput.addEventListener('input', function(e) {
            const val = this.value.trim().toLowerCase();
            if (!val || !emailSuggestions) {
                if(emailSuggestions) emailSuggestions.classList.add('hidden');
                return;
            }
            
            const matches = userList.filter(function(u) {
                const eMail = String(u.Email || '').toLowerCase();
                const nName = String(u.FullName || '').toLowerCase();
                const nick = String(u.Nickname || '').toLowerCase();
                return eMail.includes(val) || nName.includes(val) || nick.includes(val);
            }).slice(0, 10); 
            
            if (matches.length > 0) {
                let html = '';
                matches.forEach(function(u) {
                    const name = u.FullName || u.Nickname || 'ไม่มีชื่อ';
                    html += '<div class="px-4 py-2.5 hover:bg-[#31c1d7]/10 cursor-pointer border-b border-slate-50 last:border-0 transition-colors" onmousedown="window.selectEmailSuggestion(\'' + escapeJsString(u.Email) + '\')">' +
                        '<div class="font-bold text-sm text-slate-700">' + escapeHtml(name) + '</div>' +
                        '<div class="text-xs text-slate-500">' + escapeHtml(u.Email) + '</div>' +
                    '</div>';
                });
                emailSuggestions.innerHTML = html;
                emailSuggestions.classList.remove('hidden');
            } else {
                emailSuggestions.innerHTML = '<div class="px-4 py-3 text-sm text-slate-400 text-center font-medium border-dashed border border-slate-200 m-2 rounded-xl">ไม่พบรายชื่อพนักงาน</div>';
                emailSuggestions.classList.remove('hidden');
            }
        });

        emailInput.addEventListener('blur', function() { 
            setTimeout(function() {
                if (emailInput.value.trim() !== '') window.addEmailTag(emailInput.value); 
                if(emailSuggestions) emailSuggestions.classList.add('hidden');
            }, 200);
        });
    }
    lessonFormEventsInitialized = true;
}

/* ==========================================
   ฟังก์ชันเปิด/ปิด/บันทึก คอร์สเรียน
========================================== */

function openLessonModal(lessonId) {
    const modal = document.getElementById('lesson-modal');
    const form = document.getElementById('lesson-form');
    
    if(typeof initLessonFormEvents === 'function') initLessonFormEvents(); 

    form.reset();

    if (lessonId) {
        const lesson = lessons.find(function(l) { return l.LessonID === lessonId; });
        document.getElementById('lesson-id').value = lesson.LessonID;
        document.getElementById('lesson-title').value = lesson.Title;
        document.getElementById('lesson-desc').value = lesson.Description;
        document.getElementById('lesson-is-active').checked = lesson.IsActive;
        
        const isFeat = document.getElementById('lesson-is-featured');
        if (isFeat) isFeat.checked = (lesson.IsFeatured === true || lesson.IsFeatured === 'TRUE' || String(lesson.IsFeatured).toLowerCase() === 'true');
        
        // JAVIS ADDED: โหลดค่า IsCategoryFeatured
        const isCatFeat = document.getElementById('lesson-is-category-featured');
        const catFeatOrder = document.getElementById('lesson-category-featured-order');
        const catFeatContainer = document.getElementById('cat-feat-order-container');
        
        if (lesson.IsCategoryFeatured && String(lesson.IsCategoryFeatured) !== '0' && String(lesson.IsCategoryFeatured).toLowerCase() !== 'false') {
            if (isCatFeat) isCatFeat.checked = true;
            if (catFeatOrder) {
                let orderVal = parseInt(lesson.IsCategoryFeatured);
                catFeatOrder.value = isNaN(orderVal) ? 1 : orderVal;
            }
            if (catFeatContainer) catFeatContainer.classList.remove('hidden');
        } else {
            if (isCatFeat) isCatFeat.checked = false;
            if (catFeatOrder) catFeatOrder.value = 1;
            if (catFeatContainer) catFeatContainer.classList.add('hidden');
        }

        if(lesson.MainCategory) document.getElementById('lesson-main-category').value = lesson.MainCategory;
        else document.getElementById('lesson-main-category').value = '';
        
        filterSubCategories(lesson.Category || '');
        
        window.currentEmailTags = (lesson.TargetEmails || '').split(',').map(function(s) { return s.trim().toLowerCase(); }).filter(Boolean);
        if(typeof renderEmailTags === 'function') renderEmailTags();
        const emailInput = document.getElementById('lesson-email-input');
        if (emailInput) emailInput.value = '';

        window.currentDeptTags = (lesson.TargetDepartments || '').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
        if(typeof renderDeptTags === 'function') renderDeptTags();
        const deptInput = document.getElementById('search-dept-input');
        if (deptInput) deptInput.value = '';

        window.currentPosTags = (lesson.TargetPositions || '').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
        if(typeof renderPosTags === 'function') renderPosTags();
        const posInput = document.getElementById('search-pos-input');
        if (posInput) posInput.value = '';

        document.getElementById('lesson-modal-title').textContent = 'แก้ไขคอร์สเรียน';
    } else {
        document.getElementById('lesson-id').value = '';
        document.getElementById('lesson-is-active').checked = true;
        const isFeat = document.getElementById('lesson-is-featured');
        if (isFeat) isFeat.checked = false; 
        
        const isCatFeat = document.getElementById('lesson-is-category-featured');
        const catFeatOrder = document.getElementById('lesson-category-featured-order');
        const catFeatContainer = document.getElementById('cat-feat-order-container');
        if (isCatFeat) isCatFeat.checked = false;
        if (catFeatOrder) catFeatOrder.value = 1;
        if (catFeatContainer) catFeatContainer.classList.add('hidden');

        document.getElementById('lesson-main-category').value = '';
        filterSubCategories(); 
        
        window.currentEmailTags = [];
        if(typeof renderEmailTags === 'function') renderEmailTags();
        const emailInput = document.getElementById('lesson-email-input');
        if (emailInput) emailInput.value = '';

        window.currentDeptTags = ['ทั้งหมด (All)'];
        if(typeof renderDeptTags === 'function') renderDeptTags();
        const deptInput = document.getElementById('search-dept-input');
        if (deptInput) deptInput.value = '';

        window.currentPosTags = ['ทั้งหมด (All)'];
        if(typeof renderPosTags === 'function') renderPosTags();
        const posInput = document.getElementById('search-pos-input');
        if (posInput) posInput.value = '';

        document.getElementById('lesson-modal-title').textContent = 'เพิ่มคอร์สเรียนใหม่';
    }
    modal.classList.remove('hidden');
}

function saveLesson(e) {
    e.preventDefault();
    const saveBtn = document.getElementById('save-lesson-btn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = 'กำลังบันทึก...';

    const isFeaturedEl = document.getElementById('lesson-is-featured');
    
    // JAVIS ADDED: ดึงค่าตัวเลขแนะนำประจำหมวด
    const isCatFeaturedEl = document.getElementById('lesson-is-category-featured');
    const catFeatOrderEl = document.getElementById('lesson-category-featured-order');
    let categoryFeaturedValue = '0';
    if (isCatFeaturedEl && isCatFeaturedEl.checked) {
        categoryFeaturedValue = catFeatOrderEl && catFeatOrderEl.value ? catFeatOrderEl.value : '1';
    }

    const lessonData = {
        LessonID: document.getElementById('lesson-id').value,
        Title: document.getElementById('lesson-title').value,
        Description: document.getElementById('lesson-desc').value,
        MainCategory: document.getElementById('lesson-main-category').value, 
        Category: document.getElementById('lesson-category').value,
        IsActive: document.getElementById('lesson-is-active').checked,
        IsFeatured: isFeaturedEl ? isFeaturedEl.checked : false, 
        IsCategoryFeatured: categoryFeaturedValue, 
        TargetDepartments: window.currentDeptTags ? window.currentDeptTags.join(', ') : '',
        TargetPositions: window.currentPosTags ? window.currentPosTags.join(', ') : '',
        TargetEmails: window.currentEmailTags ? window.currentEmailTags.join(',') : ''
    };

    const isNew = !lessonData.LessonID;

    google.script.run
        .withSuccessHandler(function(response) {
            if(response.status === 'success') {
                document.getElementById('lesson-modal').classList.add('hidden');
                if (isNew) {
                    lessonData.LessonID = response.newId || ('TEMP-' + Date.now()); 
                    lessons.push(lessonData);
                    showAdminToast('เพิ่มคอร์สเรียนใหม่เรียบร้อย');
                } else {
                    const idx = lessons.findIndex(function(l) { return l.LessonID === lessonData.LessonID; });
                    if (idx > -1) lessons[idx] = lessonData;
                    showAdminToast('บันทึกการแก้ไขเรียบร้อย');
                }
                renderLessonsList();
                saveBtn.disabled = false;
                saveBtn.innerHTML = 'บันทึกคอร์สเรียน';
            } else {
                showAdminToast('เกิดข้อผิดพลาด: ' + response.message, 'error');
                saveBtn.disabled = false;
                saveBtn.innerHTML = 'บันทึกข้อมูล';
            }
        })
        .saveLesson(lessonData);
}

function deleteLesson(lessonId) {
    showCustomConfirm({
        title: 'ยืนยันการลบคอร์สเรียน',
        message: 'คุณแน่ใจหรือไม่ว่าต้องการลบคอร์สนี้?<br><span class="text-rose-500 text-xs font-bold">(วิดีโอและข้อสอบข้างในจะถูกลบทั้งหมด)</span>',
        type: 'danger',
        confirmText: 'ลบคอร์สเรียน',
        onConfirm: function() {
            showAdminToast('กำลังลบข้อมูล...');
            google.script.run
                .withSuccessHandler(function(response) {
                    if(response.status === 'success') {
                        lessons = lessons.filter(function(l) { return l.LessonID !== lessonId; });
                        if(activeLessonId === lessonId) {
                            activeLessonId = null;
                            activeSectionId = null;
                        }
                        renderLessonsList();
                        renderSectionsList();
                        renderQuizzesList();
                        showAdminToast('ลบคอร์สเรียนเรียบร้อย');
                    }
                })
                .deleteLesson(lessonId);
        }
    });
}

/* ==========================================
   4. ระบบจัดการวิดีโอ (Sections) - และระบบ Sortable ลากวาง
========================================== */

function updateSectionUrlLabel() {
    const type = document.getElementById('section-content-type').value;
    const label = document.getElementById('label-section-url');
    const input = document.getElementById('section-youtube');
    
    if (type === 'youtube') {
        label.textContent = 'YouTube Video ID (เช่น dQw4w9WgXcQ)';
        input.placeholder = 'รหัส หรือ ลิงก์ YouTube';
    } else if (type === 'external') {
        label.textContent = 'URL เว็บไซต์ภายนอก';
        input.placeholder = 'เช่น https://thaimooc.org/...';
    }
}

function renderSectionsList() {
    const container = document.getElementById('admin-sections-list');
    const headerTitle = document.getElementById('section-header-title');
    if (!container) return;

    if (!activeLessonId) {
        container.innerHTML = '<div class="text-center p-8 text-slate-400">กรุณาเลือกคอร์สเรียนด้านซ้ายก่อน</div>';
        headerTitle.textContent = 'เนื้อหาย่อย (เลือกคอร์สก่อน)';
        return;
    }

    const lessonSections = sections.filter(function(s) { return s.LessonID === activeLessonId; }).sort(function(a,b) { return a.Order - b.Order; });
    headerTitle.textContent = 'เนื้อหาย่อย (' + lessonSections.length + ')';

    if (lessonSections.length === 0) {
        container.innerHTML = '<div class="text-center p-8 text-slate-400 border border-dashed border-slate-200 rounded-xl mt-4">ยังไม่มีเนื้อหาในคอร์สนี้</div>';
        return;
    }

    const dragIcon = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>';

    // JAVIS ADDED: เพิ่ม ID sections-sortable-container ให้คอลัมน์เนื้อหาย่อย
    let html = '<div class="space-y-3" id="sections-sortable-container">';
    lessonSections.forEach(function(sec) {
        const vp = sec.VideoPoints !== undefined ? sec.VideoPoints : 10;
        const qp = sec.QuizPoints !== undefined ? sec.QuizPoints : 50;

        let typeBadge = '';
        if (sec.ContentType === 'external') typeBadge = '<span class="text-[10px] bg-rose-100 text-rose-600 px-1.5 py-0.5 rounded font-bold ml-2 shadow-sm">External</span>';
        else typeBadge = '<span class="text-[10px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded font-bold ml-2 shadow-sm">YouTube</span>';

        html += '<div class="admin-list-item section-item bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center hover:border-emerald-300 transition-colors ' + (activeSectionId === sec.SectionID ? 'ring-2 ring-emerald-400 bg-emerald-50/30' : '') + '" onclick="selectSection(\'' + sec.SectionID + '\')" data-id="' + sec.SectionID + '">' +
            '<div class="flex items-center flex-grow overflow-hidden">' +
            '<div class="drag-handle cursor-move p-2 text-slate-300 hover:text-emerald-500 mr-1" title="ลากเพื่อจัดลำดับ">' + dragIcon + '</div>' + 
            '<div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-sm flex-shrink-0 section-order-badge">' + sec.Order + '</div>' +
            '<div class="ml-3 truncate flex-grow">' +
            '<p class="font-bold text-slate-800 text-sm truncate">' + escapeHtml(sec.Title) + typeBadge + '</p>' +
            '<p class="text-[10px] text-slate-500 mt-1 font-medium tracking-wide">ดูจบ: <span class="text-[#31c1d7] font-bold">' + vp + ' BN</span> | สอบผ่าน: <span class="text-[#31c1d7] font-bold">' + qp + ' BN</span></p>' +
            '</div>' +
            '</div>' +
            '<div class="flex space-x-1 ml-2 flex-shrink-0">' +
            '<button onclick="event.stopPropagation(); openSectionModal(\'' + sec.SectionID + '\')" class="p-1.5 text-emerald-600 hover:bg-emerald-100 rounded-lg transition-colors" title="แก้ไข">' +
            '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>' +
            '</button>' +
            '<button onclick="event.stopPropagation(); deleteSection(\'' + sec.SectionID + '\')" class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="ลบ">' +
            '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>' +
            '</button>' +
            '</div>' +
            '</div>';
    });
    html += '</div>';
    container.innerHTML = html;

    // JAVIS ADDED: ผูกระบบลากและวาง (SortableJS) ให้กับคอลัมน์เนื้อหาย่อย
    const sortableContainer = document.getElementById('sections-sortable-container');
    if (sortableContainer && typeof Sortable !== 'undefined') {
        if (window.sectionSortable) { window.sectionSortable.destroy(); }
        window.sectionSortable = new Sortable(sortableContainer, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            handle: '.drag-handle',
            onEnd: function(evt) {
                const items = sortableContainer.querySelectorAll('.section-item');
                let updates = [];
                items.forEach((item, index) => {
                    const newOrder = index + 1;
                    item.querySelector('.section-order-badge').textContent = newOrder;
                    const secId = item.getAttribute('data-id');
                    
                    const secIndex = sections.findIndex(s => s.SectionID === secId);
                    if (secIndex > -1) {
                        if (sections[secIndex].Order != newOrder) {
                            sections[secIndex].Order = newOrder;
                            updates.push(sections[secIndex]);
                        }
                    }
                });

                if (updates.length > 0) {
                    showAdminToast('กำลังบันทึกลำดับเนื้อหา...', 'success');
                    let completed = 0;
                    updates.forEach(sec => {
                        google.script.run.withSuccessHandler(function() {
                            completed++;
                            if(completed === updates.length) {
                                showAdminToast('อัปเดตลำดับเนื้อหาเรียบร้อยแล้ว', 'success');
                            }
                        }).saveSection(sec);
                    });
                }
            }
        });
    }
}

function selectSection(sectionId) {
    activeSectionId = sectionId;
    renderSectionsList();
    renderQuizzesList();
}

function openSectionModal(sectionId) {
    if (!activeLessonId && !sectionId) {
        showAdminToast('กรุณาเลือกคอร์สเรียนหลักก่อนเพิ่มเนื้อหาครับ', 'warning');
        return;
    }

    const modal = document.getElementById('section-modal');
    const form = document.getElementById('section-form');
    
    if (sectionId && typeof sectionId === 'string') {
        const sec = sections.find(function(s) { return s.SectionID === sectionId; });
        document.getElementById('section-id').value = sec.SectionID;
        document.getElementById('section-lesson-id').value = sec.LessonID;
        document.getElementById('section-title').value = sec.Title;
        document.getElementById('section-youtube').value = sec.YouTubeVideoID;
        document.getElementById('section-order').value = sec.Order;
        
        document.getElementById('section-video-points').value = sec.VideoPoints !== undefined ? sec.VideoPoints : 10;
        document.getElementById('section-quiz-points').value = sec.QuizPoints !== undefined ? sec.QuizPoints : 50;
        document.getElementById('section-duration').value = sec.Duration !== undefined ? sec.Duration : 15;
        
        document.getElementById('section-content-type').value = sec.ContentType || 'youtube';

        document.getElementById('section-modal-title').textContent = 'แก้ไขเนื้อหาย่อย';
    } else {
        form.reset();
        document.getElementById('section-id').value = '';
        document.getElementById('section-lesson-id').value = activeLessonId;
        
        const lessonSections = sections.filter(function(s) { return s.LessonID === activeLessonId; });
        document.getElementById('section-order').value = lessonSections.length + 1;

        document.getElementById('section-video-points').value = 10;
        document.getElementById('section-quiz-points').value = 50;
        document.getElementById('section-duration').value = 15;
        
        document.getElementById('section-content-type').value = 'youtube';

        document.getElementById('section-modal-title').textContent = 'เพิ่มเนื้อหาใหม่';
    }
    
    if(typeof updateSectionUrlLabel === 'function') updateSectionUrlLabel();
    
    modal.classList.remove('hidden');
}

function saveSection(e) {
    e.preventDefault();
    const saveBtn = document.getElementById('save-section-btn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = 'กำลังบันทึก...';

    const sectionData = {
        SectionID: document.getElementById('section-id').value,
        LessonID: document.getElementById('section-lesson-id').value,
        Title: document.getElementById('section-title').value,
        YouTubeVideoID: document.getElementById('section-youtube').value, 
        Order: document.getElementById('section-order').value,
        Duration: parseInt(document.getElementById('section-duration').value) || 15,
        VideoPoints: parseInt(document.getElementById('section-video-points').value) || 0,
        QuizPoints: parseInt(document.getElementById('section-quiz-points').value) || 0,
        ContentType: document.getElementById('section-content-type').value 
    };

    const isNew = !sectionData.SectionID;

    google.script.run
        .withSuccessHandler(function(response) {
            if(response.status === 'success') {
                document.getElementById('section-modal').classList.add('hidden');
                if (isNew) {
                    sectionData.SectionID = response.newId || ('SEC-' + Date.now());
                    sections.push(sectionData);
                    showAdminToast('เพิ่มเนื้อหาใหม่เรียบร้อย');
                } else {
                    const idx = sections.findIndex(function(s) { return s.SectionID === sectionData.SectionID; });
                    if (idx > -1) sections[idx] = sectionData;
                    showAdminToast('บันทึกการแก้ไขเนื้อหาเรียบร้อย');
                }
                renderSectionsList();
                saveBtn.disabled = false;
                saveBtn.innerHTML = 'บันทึกเนื้อหา';
            } else {
                showAdminToast(response.message, 'error');
                saveBtn.disabled = false;
                saveBtn.innerHTML = 'บันทึกข้อมูล';
            }
        })
        .saveSection(sectionData);
}

function deleteSection(sectionId) {
    showCustomConfirm({
        title: 'ยืนยันการลบเนื้อหา',
        message: 'คุณแน่ใจหรือไม่ว่าต้องการลบเนื้อหานี้?',
        type: 'danger',
        confirmText: 'ลบเนื้อหา',
        onConfirm: function() {
            showAdminToast('กำลังลบ...');
            google.script.run
                .withSuccessHandler(function(response) {
                    if(response.status === 'success') {
                        sections = sections.filter(function(s) { return s.SectionID !== sectionId; });
                        if(activeSectionId === sectionId) activeSectionId = null;
                        renderSectionsList();
                        renderQuizzesList();
                        showAdminToast('ลบเนื้อหาเรียบร้อย');
                    }
                })
                .deleteSection(sectionId);
        }
    });
}

   5. ระบบจัดการแบบทดสอบ (Quizzes)

function renderQuizzesList() {
    const container = document.getElementById('admin-quizzes-list');
    if (!container) return;

    if (!activeSectionId) {
        container.innerHTML = '<div class="text-center p-8 text-slate-400">กรุณาเลือกเนื้อหาด้านซ้ายก่อน</div>';
        return;
    }

    const sectionQuizzes = quizzes.filter(function(q) { return q.SectionID === activeSectionId; });
    
    if (sectionQuizzes.length === 0) {
        container.innerHTML = '<div class="text-center p-6 text-slate-400 border border-dashed border-slate-200 rounded-xl mt-4 text-sm">เนื้อหานี้ยังไม่มีแบบทดสอบ</div>';
        return;
    }

    let html = '<div class="space-y-3">';
    sectionQuizzes.forEach(function(quiz, idx) {
        const questionText = quiz.QuestionText || quiz.Question || '';
        const quizId = quiz.QuestionID || quiz.QuizID || '';
        
        let typeBadge = '';
        try {
            const opts = JSON.parse(quiz.Options);
            if (!opts || opts.length === 0) typeBadge = '<span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-bold ml-2">อัตนัย</span>';
            else typeBadge = '<span class="text-[10px] bg-violet-100 text-violet-700 px-2 py-0.5 rounded font-bold ml-2">ปรนัย (' + opts.length + ')</span>';
        } catch(e) {
            typeBadge = '<span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-bold ml-2">อัตนัย</span>';
        }

        html += '<div class="admin-list-item bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-start hover:border-violet-300 transition-colors">' +
            '<div class="flex-grow pr-3">' +
            '<p class="font-bold text-sm text-slate-800">' + (idx + 1) + '. ' + escapeHtml(questionText) + typeBadge + '</p>' +
            '</div>' +
            '<div class="flex space-x-1 flex-shrink-0">' +
            '<button onclick="openQuizModal(\'' + quizId + '\')" class="p-1.5 text-violet-600 hover:bg-violet-100 rounded-lg transition-colors" title="แก้ไข">' +
            '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>' +
            '</button>' +
            '<button onclick="deleteQuiz(\'' + quizId + '\')" class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="ลบ">' +
            '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>' +
            '</button>' +
            '</div>' +
            '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
}

function toggleQuizType() {
    const type = document.getElementById('quiz-type').value;
    if(type === 'subjective') {
        document.getElementById('multiple-choice-container').classList.add('hidden');
        document.getElementById('subjective-container').classList.remove('hidden');
    } else {
        document.getElementById('multiple-choice-container').classList.remove('hidden');
        document.getElementById('subjective-container').classList.add('hidden');
    }
}

var dynamicOptionCount = 0;
function addQuizOption(value, isCorrect) {
    if (value === undefined) value = '';
    if (isCorrect === undefined) isCorrect = false;
    
    dynamicOptionCount++;
    const container = document.getElementById('dynamic-options-list');
    const div = document.createElement('div');
    div.className = 'flex items-center space-x-3 bg-white p-2 rounded-xl border border-violet-100 option-row shadow-sm';
    
    const checkedAttr = isCorrect ? 'checked' : '';
    
    div.innerHTML = '<input type="radio" name="correct_option" class="w-5 h-5 text-violet-600 focus:ring-violet-500 cursor-pointer ml-2" ' + checkedAttr + '>' +
        '<input type="text" class="quiz-option-input flex-grow px-3 py-2 border-none focus:ring-0 outline-none text-sm" value="' + escapeHtml(value) + '" placeholder="พิมพ์ตัวเลือก...">' +
        '<button type="button" class="text-slate-400 hover:text-red-500 p-2 mr-1 rounded-lg hover:bg-red-50 transition-colors" onclick="this.parentElement.remove()" title="ลบตัวเลือก"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>';
    container.appendChild(div);
}

function openQuizModal(quizId) {
    if (!activeSectionId) {
        showAdminToast('กรุณาเลือกเนื้อหาก่อนเพิ่มข้อสอบครับ', 'warning');
        return;
    }

    const modal = document.getElementById('quiz-modal');
    const form = document.getElementById('quiz-form');
    
    form.reset();
    document.getElementById('dynamic-options-list').innerHTML = '';
    dynamicOptionCount = 0;
    
    if (quizId && typeof quizId === 'string') {
        const quiz = quizzes.find(function(q) { return (q.QuestionID === quizId || q.QuizID === quizId); });
        document.getElementById('quiz-id').value = quiz.QuestionID || quiz.QuizID;
        document.getElementById('quiz-section-id').value = quiz.SectionID;
        document.getElementById('quiz-question').value = quiz.QuestionText || quiz.Question;
        
        let options = [];
        try { options = JSON.parse(quiz.Options); } catch(e) {}

        const correctAns = quiz.CorrectAnswer || quiz.Answer;

        if (!options || options.length === 0) {
            document.getElementById('quiz-type').value = 'subjective';
            currentAnswerTags = correctAns ? correctAns.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];
            if(typeof renderAnswerTags === 'function') renderAnswerTags();
            document.getElementById('subjective-answer-input').value = '';
        } else {
            document.getElementById('quiz-type').value = 'multiple_choice';
            currentAnswerTags = [];
            if(typeof renderAnswerTags === 'function') renderAnswerTags();
            options.forEach(function(opt) {
                addQuizOption(opt, opt === correctAns);
            });
        }
        
        document.getElementById('quiz-modal-title').textContent = 'แก้ไขข้อสอบ';
    } else {
        document.getElementById('quiz-id').value = '';
        document.getElementById('quiz-section-id').value = activeSectionId;
        document.getElementById('quiz-type').value = 'multiple_choice';
        
        currentAnswerTags = [];
        if(typeof renderAnswerTags === 'function') renderAnswerTags();
        addQuizOption('', true);
        addQuizOption('', false);
        
        document.getElementById('quiz-modal-title').textContent = 'เพิ่มข้อสอบใหม่';
    }
    
    toggleQuizType();
    modal.classList.remove('hidden');
}

function saveQuiz(e) {
    e.preventDefault();
    const saveBtn = document.getElementById('save-quiz-btn');
    const type = document.getElementById('quiz-type').value;
    
    let finalOptions = [];
    let finalAnswer = '';

    if (type === 'subjective') {
        const leftover = document.getElementById('subjective-answer-input').value.trim();
        if(leftover && typeof addAnswerTag === 'function') addAnswerTag(leftover);
        
        finalAnswer = currentAnswerTags.join(',');
        if (!finalAnswer) {
            showAdminToast('กรุณาระบุคีย์เวิร์ดคำตอบที่ถูกต้องอย่างน้อย 1 คำ', 'error');
            return;
        }
    } else {
        const rows = document.querySelectorAll('.option-row');
        let isAnyChecked = false;
        rows.forEach(function(row) {
            const val = row.querySelector('.quiz-option-input').value.trim();
            const isChecked = row.querySelector('input[type="radio"]').checked;
            if (val) {
                finalOptions.push(val);
                if (isChecked) {
                    finalAnswer = val;
                    isAnyChecked = true;
                }
            }
        });

        if (finalOptions.length < 2) {
            showAdminToast('ปรนัยต้องมีอย่างน้อย 2 ตัวเลือก', 'error');
            return;
        }
        if (!isAnyChecked) {
            showAdminToast('กรุณาเลือกข้อที่ถูกต้องด้วยครับ', 'error');
            return;
        }
    }

    saveBtn.disabled = true;
    saveBtn.innerHTML = 'กำลังบันทึก...';

    const questionData = {
        id: document.getElementById('quiz-id').value,
        sectionId: document.getElementById('quiz-section-id').value,
        questionText: document.getElementById('quiz-question').value,
        options: finalOptions, 
        correctAnswer: finalAnswer
    };

    const isNew = !questionData.id;

    google.script.run
        .withSuccessHandler(function(response) {
            if(response.status === 'success') {
                document.getElementById('quiz-modal').classList.add('hidden');
                
                if (isNew) {
                    const newRecord = {
                        QuestionID: response.newId || ('QZ-' + Date.now()),
                        SectionID: questionData.sectionId,
                        QuestionText: questionData.questionText,
                        Options: JSON.stringify(questionData.options),
                        CorrectAnswer: questionData.correctAnswer
                    };
                    quizzes.push(newRecord);
                    showAdminToast('เพิ่มข้อสอบใหม่เรียบร้อย');
                } else {
                    const idx = quizzes.findIndex(function(q) { return q.QuestionID === questionData.id || q.QuizID === questionData.id; });
                    if (idx > -1) {
                        quizzes[idx].QuestionText = questionData.questionText;
                        quizzes[idx].Question = questionData.questionText;
                        quizzes[idx].Options = JSON.stringify(questionData.options);
                        quizzes[idx].CorrectAnswer = questionData.correctAnswer;
                        quizzes[idx].Answer = questionData.correctAnswer;
                    }
                    showAdminToast('บันทึกข้อสอบเรียบร้อย');
                }
                renderQuizzesList();
                saveBtn.disabled = false;
                saveBtn.innerHTML = 'บันทึกข้อสอบ';
            } else {
                showAdminToast(response.message, 'error');
                saveBtn.disabled = false;
                saveBtn.innerHTML = 'บันทึกข้อมูล';
            }
        })
        .saveQuestion(questionData); 
}

function deleteQuiz(quizId) {
    showCustomConfirm({
        title: 'ยืนยันการลบข้อสอบ',
        message: 'คุณแน่ใจหรือไม่ว่าต้องการลบข้อสอบนี้?',
        type: 'danger',
        confirmText: 'ลบข้อสอบ',
        onConfirm: function() {
            showAdminToast('กำลังลบ...');
            google.script.run
                .withSuccessHandler(function(response) {
                    if(response.status === 'success') {
                        quizzes = quizzes.filter(function(q) { return q.QuizID !== quizId && q.QuestionID !== quizId; });
                        renderQuizzesList();
                        showAdminToast('ลบข้อสอบเรียบร้อย');
                    }
                })
                .deleteQuestion(quizId); 
        }
    });
}

         showAdminToast('ดูสถิติเพิ่มเติมได้ที่แท็บ รายงานผู้เรียน', 'info');
         return;
    }
    const lesson = lessons.find(function(l) { return l.LessonID === lessonId; });
    
    // JAVIS FIX: อัปเดตข้อความพร้อมแสดงชื่อคอร์ส
    const titleEl = document.getElementById('course-learners-title');
    if(titleEl) titleEl.textContent = 'ผู้เรียน: ' + (lesson ? lesson.Title : '');
    
    content.innerHTML = '<div class="text-center p-8 text-slate-500 bg-white rounded-xl border border-slate-100"><div class="text-4xl mb-3">📊</div>สามารถดูความคืบหน้าของผู้เรียนแบบละเอียด<br>ได้ที่แท็บ <b class="text-[#31c1d7]">"รายงานผู้เรียน"</b> ครับ<br><button onclick="closeModals(); switchAdminTab(\'dashboard\');" class="mt-4 px-6 py-2 bg-[#31c1d7] text-white font-bold rounded-lg shadow-sm hover:bg-[#1eb0c6] transition-colors">ไปที่หน้ารายงาน</button></div>';
    modal.classList.remove('hidden');
}
