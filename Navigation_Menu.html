<script>
  (function() {
    const head = document.head || document.getElementsByTagName('head')[0];
    
    const tags = [
      { tag: 'meta', attrs: { name: 'apple-mobile-web-app-capable', content: 'yes' } },
      { tag: 'meta', attrs: { name: 'mobile-web-app-capable', content: 'yes' } },
      { tag: 'meta', attrs: { name: 'apple-mobile-web-app-status-bar-style', content: 'default' } },
      { tag: 'meta', attrs: { name: 'apple-mobile-web-app-title', content: 'SkillNeat' } },
      { tag: 'meta', attrs: { name: 'theme-color', content: '#ffffff' } },
      { tag: 'link', attrs: { rel: 'apple-touch-icon', href: 'https://i.postimg.cc/TYmnvsQR/Screenshot-2569-03-28-at-13-27-37.png' } },
      { tag: 'link', attrs: { rel: 'icon', type: 'image/png', sizes: '192x192', href: 'https://i.postimg.cc/TYmnvsQR/Screenshot-2569-03-28-at-13-27-37.png' } },
      { tag: 'link', attrs: { rel: 'shortcut icon', href: 'https://i.postimg.cc/TYmnvsQR/Screenshot-2569-03-28-at-13-27-37.png' } }
    ];

    tags.forEach(t => {
      // ตรวจสอบว่ามีแท็กนี้อยู่แล้วหรือยัง เพื่อป้องกันการใส่ซ้ำ
      if ((t.tag === 'link' && !document.querySelector('link[rel="' + t.attrs.rel + '"]')) || 
          (t.tag === 'meta' && !document.querySelector('meta[name="' + t.attrs.name + '"]'))) {
          let el = document.createElement(t.tag);
          for (let key in t.attrs) {
            el.setAttribute(key, t.attrs[key]);
          }
          head.appendChild(el);
      }
    });
  })();
</script>

<script>
  // ดึง Profile จากตัวแปรฝั่งเซิร์ฟเวอร์โดยตรง
  const serverUserProfile = <?!= typeof userProfile !== 'undefined' ? JSON.stringify(userProfile) : '{}' ?>;

  window.currentTotalBN = 0;
  window.initialCalcDone = false;

  // --- ลอจิกการคำนวณ 5 ระดับ (Rank) ---
  function getUserRank(bn) {
      if (bn >= 10000) return { name: 'SkillNeat Diamond Learners', th: 'ปรมาจารย์', icon: '👑', color: 'text-amber-500', bg: 'bg-amber-50', border: 'border-amber-200', next: null, min: 10000 };
      if (bn >= 5000) return { name: 'SkillNeat Platinum Learners', th: 'ผู้เชี่ยวชาญ', icon: '💎', color: 'text-indigo-500', bg: 'bg-indigo-50', border: 'border-indigo-200', next: 10000, min: 5000 };
      if (bn >= 2500) return { name: 'SkillNeat Gold Learners', th: 'ผู้ใฝ่รู้', icon: '🥇', color: 'text-[#31c1d7]', bg: 'bg-[#31c1d7]/10', border: 'border-[#31c1d7]/30', next: 5000, min: 2500 };
      if (bn >= 1000) return { name: 'SkillNeat Silver Learners', th: 'นักสำรวจ', icon: '🥈', color: 'text-sky-500', bg: 'bg-sky-50', border: 'border-sky-200', next: 2500, min: 1000 };
      return { name: 'SkillNeat Bronze Learners', th: 'ผู้เริ่มต้น', icon: '🥉', color: 'text-slate-500', bg: 'bg-slate-50', border: 'border-slate-200', next: 1000, min: 0 };
  }

  // ระบบอัปเดตคะแนนแบบ Real-time ดึงค่าจากชีทโดยตรง!
  window.updateNavbarRank = function(liveData, addPoints = 0) {
      
      // ถ้าระบบสั่งบวกคะแนน (เช่น ตอนเรียนจบ หรือสอบผ่าน) ก็บวกเข้าตัวเลขที่โชว์อยู่ได้เลย
      if (addPoints > 0) {
          window.currentTotalBN += addPoints;
      } 
      // ถ้าโหลดเว็บครั้งแรก (รีเฟรชหน้า)
      else if (!window.initialCalcDone) {
          let data = liveData; 
          if (!data) { 
              const serverDataElement = document.getElementById('server-data');
              if (serverDataElement) {
                  try { data = JSON.parse(serverDataElement.textContent || '{}'); } catch(e) {}
              }
          }
          
          // JAVIS FIX: บังคับให้ใช้คะแนนที่คำนวณสดใหม่จาก Backend เท่านั้น (ลบการอ้างอิง UserProfile เก่าทิ้ง)
          if (data && data.userInfo && data.userInfo.totalBN !== undefined) {
              window.currentTotalBN = parseInt(data.userInfo.totalBN) || 0;
          } else {
              window.currentTotalBN = 0;
          }
          
          window.initialCalcDone = true;
      }
      
      const rank = getUserRank(window.currentTotalBN);
      const rankBadgeContainer = document.getElementById('nav-rank-badge');
      
      // อัปเดตขึ้น UI ที่ Navbar
      if (rankBadgeContainer) {
          rankBadgeContainer.innerHTML = `
              <a href="<?= baseUrl ?>?page=profile" class="flex items-center space-x-2 px-3 py-1.5 ${rank.bg} ${rank.border} border rounded-xl shadow-sm cursor-pointer hover:scale-105 transition-transform" title="คะแนนสะสม: ${window.currentTotalBN} BN">
                  <span class="text-xl leading-none drop-shadow-sm">${rank.icon}</span>
                  <div class="flex flex-col justify-center">
                      <span class="text-[10px] font-black ${rank.color} uppercase tracking-wider leading-none">${rank.name}</span>
                      <span class="text-[11px] font-bold text-slate-600 leading-none mt-1">${new Intl.NumberFormat().format(window.currentTotalBN)} BN</span>
                  </div>
              </a>
          `;
      }
      
      // ส่งข้อมูลอัปเดตนี้ไปยังหน้า Profile_View ด้วยเพื่อให้การ์ดอัปเดตตาม
      window.userRankData = { bn: window.currentTotalBN, rank: rank };
      document.dispatchEvent(new CustomEvent('rankDataReady'));
  };

  window.updateBottomNav = function(activeTab) {
      const btns = document.querySelectorAll('.bottom-nav-btn');
      btns.forEach(btn => {
          btn.classList.remove('text-[#31c1d7]', 'active-bottom-nav');
          btn.classList.add('text-slate-400');
      });
      
      const activeBtn = document.getElementById('bottom-nav-' + activeTab);
      if(activeBtn) {
          activeBtn.classList.remove('text-slate-400');
          activeBtn.classList.add('text-[#31c1d7]', 'active-bottom-nav');
      }
  };

  (function() {
    function updateActiveNav(currentPage, currentTab) {
      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
        if (link.getAttribute('data-page') === currentPage && currentTab !== 'mycourses') {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (typeof google !== 'undefined' && google.script && google.script.url) {
            google.script.url.getLocation(function(location) {
                const currentPage = location.parameter.page || 'student';
                const currentTab = location.parameter.tab;
                updateActiveNav(currentPage, currentTab);
            });
        } else {
            const urlParams = new URLSearchParams(window.location.search);
            const currentPage = urlParams.get('page') || 'student';
            const currentTab = urlParams.get('tab');
            updateActiveNav(currentPage, currentTab);
        }
        
        window.updateNavbarRank();

        if (typeof window.showView === 'function') {
            const originalShowView = window.showView;
            window.showView = function(viewId) {
                originalShowView(viewId);
                if (viewId === 'lessonList') updateBottomNav('home');
                else if (viewId === 'myCoursesView') updateBottomNav('courses');
                else if (viewId === 'profile') updateBottomNav('profile');
            };
        }
    });
  })();
</script>
