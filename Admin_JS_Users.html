<script>
/* ==========================================
   6. ระบบจัดการพนักงาน (Users)
========================================== */
function renderUsersList() {
    try {
        const container = document.getElementById('admin-users-list');
        if (!container) return;

        let filterContainer = document.getElementById('admin-users-filter-container');
        if (!filterContainer) {
            const wrapper = container.closest('.overflow-x-auto');
            if (wrapper) {
                const filterHtml = '<div id="admin-users-filter-container" class="flex flex-col md:flex-row gap-3 mb-4 w-full">' +
                    '<div class="relative flex-grow">' +
                        '<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">' +
                            '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>' +
                        '</div>' +
                        '<input type="text" id="admin-user-search-val" placeholder="ค้นหาชื่อ, อีเมลพนักงาน..." class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-[#31c1d7] outline-none transition-all font-medium text-slate-700 shadow-sm">' +
                    '</div>' +
                    '<select id="admin-user-dept-val" class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 focus:ring-2 focus:ring-[#31c1d7] outline-none min-w-[160px] transition-all cursor-pointer shadow-sm">' +
                        '<option value="">ทุกแผนก</option>' +
                    '</select>' +
                    '<select id="admin-user-pos-val" class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 focus:ring-2 focus:ring-[#31c1d7] outline-none min-w-[160px] transition-all cursor-pointer shadow-sm">' +
                        '<option value="">ทุกระดับ (Level)</option>' +
                    '</select>' +
                '</div>';
                wrapper.insertAdjacentHTML('beforebegin', filterHtml);
                
                document.getElementById('admin-user-search-val').addEventListener('input', renderUsersList);
                document.getElementById('admin-user-dept-val').addEventListener('change', renderUsersList);
                document.getElementById('admin-user-pos-val').addEventListener('change', renderUsersList);
            }
        }

        const deptSelect = document.getElementById('admin-user-dept-val');
        if (deptSelect && deptSelect.options.length <= 1 && masterData && masterData.departments) {
            masterData.departments.forEach(function(d) {
                if (d !== 'ทั้งหมด (All)') deptSelect.insertAdjacentHTML('beforeend', '<option value="' + escapeHtml(d) + '">' + escapeHtml(d) + '</option>');
            });
        }
        const posSelect = document.getElementById('admin-user-pos-val');
        if (posSelect && posSelect.options.length <= 1 && masterData && masterData.positions) {
            masterData.positions.forEach(function(p) {
                if (p !== 'ทั้งหมด (All)') posSelect.insertAdjacentHTML('beforeend', '<option value="' + escapeHtml(p) + '">' + escapeHtml(p) + '</option>');
            });
        }

        const searchInput = document.getElementById('admin-user-search-val');
        const deptInput = document.getElementById('admin-user-dept-val');
        const posInput = document.getElementById('admin-user-pos-val');
        
        const searchKw = searchInput ? String(searchInput.value).toLowerCase().trim() : '';
        const filterDept = deptInput ? deptInput.value : '';
        const filterPos = posInput ? posInput.value : '';

        const filteredUsers = users.filter(function(u) {
            const fName = String(u.FullName || '').toLowerCase();
            const eMail = String(u.Email || '').toLowerCase();
            const nName = String(u.Nickname || '').toLowerCase();
            const jTitle = String(u.JobTitle || '').toLowerCase(); 
            
            const matchKw = searchKw === '' || fName.includes(searchKw) || eMail.includes(searchKw) || nName.includes(searchKw) || jTitle.includes(searchKw);
            
            const uDept = (u.Department && u.Department !== 'General') ? u.Department : 'ส่วนกลาง';
            const matchDept = filterDept === '' || uDept === filterDept;
            
            const uPos = u.Position || 'พนักงานทั่วไป';
            const matchPos = filterPos === '' || uPos === filterPos;
            
            return matchKw && matchDept && matchPos;
        });

        if (filteredUsers.length === 0) {
            container.innerHTML = '<tr><td colspan="5" class="py-12 text-center text-slate-400 bg-slate-50/50 border border-dashed border-slate-200 rounded-2xl"><div class="text-3xl mb-2 opacity-50">🔍</div>ไม่พบข้อมูลพนักงานที่ค้นหา</td></tr>';
            return;
        }

        let html = '';
        filteredUsers.forEach(function(user) {
            const safeEmail = escapeJsString(String(user.Email || ''));
            const emailPrefix = safeEmail.split('@')[0] || 'User';
            const img = user.ProfileImage || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.Nickname || emailPrefix) + '&background=31c1d7&color=fff';
            const fullName = user.FullName || 'ยังไม่ระบุชื่อ';
            const nickName = user.Nickname || '-';
            const dept = user.Department && user.Department !== 'General' ? user.Department : 'ส่วนกลาง';
            const pos = user.Position || 'พนักงานทั่วไป';
            const jobTitle = user.JobTitle ? user.JobTitle : '<span class="text-slate-300 italic">ยังไม่ระบุตำแหน่ง</span>';
            
            html += '<tr class="hover:bg-slate-50/80 transition-colors group border-b border-slate-100 last:border-0">' +
                '<td class="py-4 px-4">' +
                    '<div class="flex items-center gap-4">' +
                        '<img src="' + escapeHtml(img) + '" class="w-10 h-10 rounded-full object-cover shadow-sm ring-2 ring-white group-hover:ring-[#31c1d7]/20 transition-all">' +
                        '<div>' +
                            '<p class="text-sm font-bold text-slate-800">' + escapeHtml(fullName) + '</p>' +
                            '<p class="text-[11px] text-slate-500 font-medium">ชื่อเล่น: <span class="text-slate-700">' + escapeHtml(nickName) + '</span></p>' +
                        '</div>' +
                    '</div>' +
                '</td>' +
                '<td class="py-4 px-4 text-slate-500 font-mono text-[11px]">' + escapeHtml(user.Email) + '</td>' +
                '<td class="py-4 px-4"><span class="px-3 py-1.5 bg-indigo-50 text-indigo-600 border border-indigo-100 rounded-lg text-[11px] font-bold shadow-sm">' + escapeHtml(dept) + '</span></td>' +
                '<td class="py-4 px-4">' +
                    '<p class="text-sm font-bold text-slate-700">' + jobTitle + '</p>' +
                    '<p class="text-[10px] text-slate-500 mt-1 font-medium bg-slate-100 border border-slate-200 px-2 py-0.5 rounded inline-block">ระดับ: ' + escapeHtml(pos) + '</p>' +
                '</td>' +
                '<td class="py-4 px-4 text-center">' +
                    '<div class="flex items-center justify-center gap-1.5 opacity-90 group-hover:opacity-100 transition-opacity">' +
                        '<button onclick="openUserCourseHistory(\'' + safeEmail + '\')" class="p-1.5 bg-white text-emerald-500 hover:bg-emerald-50 border border-slate-200 hover:border-emerald-200 rounded-xl transition-all shadow-sm" title="ดูประวัติการเรียนและคะแนน">' +
                            '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>' +
                        '</button>' +
                        '<button onclick="openUserModal(\'' + safeEmail + '\')" class="p-1.5 bg-white text-[#31c1d7] hover:bg-[#31c1d7]/10 border border-slate-200 hover:border-[#31c1d7]/30 rounded-xl transition-all shadow-sm" title="แก้ไขข้อมูลพื้นฐาน">' +
                            '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>' +
                        '</button>' +
                        '<button onclick="promptManualScore(\'' + safeEmail + '\')" class="p-1.5 bg-white text-amber-500 hover:bg-amber-50 border border-slate-200 hover:border-amber-200 rounded-xl transition-all shadow-sm" title="ให้คะแนนพิเศษ (+/-)">' +
                            '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>' +
                        '</button>' +
                        '<button onclick="showUserScoreLog(\'' + safeEmail + '\')" class="p-1.5 bg-white text-indigo-500 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-200 rounded-xl transition-all shadow-sm" title="ดูประวัติการให้คะแนน (Log)">' +
                            '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>' +
                        '</button>' +
                        '<button onclick="deleteUser(\'' + safeEmail + '\')" class="p-1.5 bg-white text-slate-400 hover:text-rose-500 hover:bg-rose-50 border border-slate-200 hover:border-rose-200 rounded-xl transition-all shadow-sm" title="ลบพนักงาน">' +
                            '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>' +
                        '</button>' +
                    '</div>' +
                '</td>' +
            '</tr>';
        });
        
        container.innerHTML = html;
    } catch(err) {
        console.error('Error rendering users list:', err);
    }
}

function openUserCourseHistory(email) {
    if (typeof dashboardDataList === 'undefined' || dashboardDataList.length === 0) {
        showAdminToast('กำลังอัปเดตข้อมูลผู้เรียน กรุณารอสักครู่...', 'warning');
        if(typeof loadDashboardData === 'function') loadDashboardData();
        setTimeout(function() {
            if(typeof showUserDetails === 'function') showUserDetails(email);
        }, 1500);
    } else {
        if(typeof showUserDetails === 'function') showUserDetails(email);
    }
}

function deleteUser(email) {
    showCustomConfirm({
        title: 'ยืนยันการลบพนักงาน',
        message: 'ต้องการลบพนักงาน <b>' + escapeHtml(email) + '</b> ออกจากระบบใช่หรือไม่?<br><span class="text-rose-500 text-xs mt-1 block">ข้อมูลประวัติการเรียนจะถูกลบไปด้วยและไม่สามารถกู้คืนได้</span>',
        type: 'danger',
        confirmText: 'ลบพนักงาน',
        onConfirm: function() {
            showAdminToast('กำลังลบข้อมูลพนักงาน...', 'warning');
            google.script.run
                .withSuccessHandler(function(res) {
                    if (res.status === 'success') {
                        users = users.filter(function(u) { return u.Email.toLowerCase() !== email.toLowerCase(); });
                        renderUsersList();
                        showAdminToast('ลบพนักงานออกจากระบบเรียบร้อยแล้ว', 'success');
                        if(typeof loadDashboardData === 'function') loadDashboardData();
                    } else {
                        showAdminToast(res.message, 'error');
                    }
                })
                .deleteUserAdmin(email);
        }
    });
}

function openUserModal(email) {
    const user = users.find(function(u) { return u.Email === email; });
    if (!user) return;

    document.getElementById('user-email-hidden').value = user.Email;
    document.getElementById('user-email-display').value = user.Email;
    document.getElementById('user-fullname').value = user.FullName || '';
    document.getElementById('user-nickname').value = user.Nickname || '';
    
    // JAVIS FIX: เพิ่มบรรทัดดึง JobTitle เพื่อเอามาโชว์ตอนแอดมินกด Edit ด้วย
    const jobTitleInput = document.getElementById('user-jobtitle');
    if (jobTitleInput) jobTitleInput.value = user.JobTitle || '';
    
    const deptSelect = document.getElementById('user-department');
    const posSelect = document.getElementById('user-position');
    
    if (user.Department) deptSelect.value = user.Department; else deptSelect.value = 'General';
    if (user.Position) posSelect.value = user.Position; else posSelect.value = 'พนักงานทั่วไป';

    document.getElementById('user-modal').classList.remove('hidden');
}

function saveUser(e) {
    e.preventDefault();
    const saveBtn = document.getElementById('save-user-btn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = 'กำลังบันทึก...';

    // JAVIS FIX: เช็คว่ามีช่องให้กรอก JobTitle หรือไม่ เพื่อแนบส่งกลับไปด้วย
    const jobTitleInput = document.getElementById('user-jobtitle');

    const userData = {
        Email: document.getElementById('user-email-hidden').value,
        FullName: document.getElementById('user-fullname').value.trim(),
        Nickname: document.getElementById('user-nickname').value.trim(),
        JobTitle: jobTitleInput ? jobTitleInput.value.trim() : '', // แนบตำแหน่งงานกลับไปเซฟ
        Department: document.getElementById('user-department').value,
        Position: document.getElementById('user-position').value
    };

    google.script.run
        .withSuccessHandler(function(response) {
            if(response.status === 'success') {
                document.getElementById('user-modal').classList.add('hidden');
                
                const idx = users.findIndex(function(u) { return u.Email === userData.Email; });
                if (idx > -1) {
                    users[idx].FullName = userData.FullName;
                    users[idx].Nickname = userData.Nickname;
                    users[idx].JobTitle = userData.JobTitle; // อัปเดตใน RAM ทันที
                    users[idx].Department = userData.Department;
                    users[idx].Position = userData.Position;
                }
                
                renderUsersList();
                showAdminToast('บันทึกข้อมูลพนักงานเรียบร้อยแล้ว');
                saveBtn.disabled = false;
                saveBtn.innerHTML = 'บันทึกข้อมูล';
            } else {
                showAdminToast(response.message, 'error');
                saveBtn.disabled = false;
                saveBtn.innerHTML = 'บันทึกข้อมูล';
            }
        })
        .saveUserAdmin(userData);
}

function promptManualScore(email) {
    let form = document.getElementById('manual-score-form');
    
    if (!form) {
        const modalHtml = '<div id="manual-score-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-[200] flex justify-center items-center p-4 transition-opacity">' +
            '<form id="manual-score-form" class="bg-white rounded-3xl w-full max-w-md shadow-xl overflow-hidden" onsubmit="saveManualScore(event)">' +
                '<div class="px-6 py-5 border-b border-slate-100 bg-white flex justify-between items-center">' +
                    '<div class="flex items-center gap-3">' +
                        '<span class="text-2xl">✨</span>' +
                        '<h3 class="text-2xl font-extrabold text-slate-800">เพิ่ม/ลด คะแนนพิเศษ</h3>' +
                    '</div>' +
                    '<button type="button" onclick="closeModals()" class="text-slate-400 hover:text-red-500 bg-slate-50 hover:bg-red-50 rounded-full w-8 h-8 flex items-center justify-center font-bold transition-colors">&times;</button>' +
                '</div>' +
                '<div class="p-6 bg-slate-50/50 space-y-4">' +
                    '<div>' +
                        '<label class="block text-sm font-bold text-slate-700 mb-1">อีเมลพนักงาน</label>' +
                        '<input type="text" id="manual-score-email" disabled class="w-full px-4 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-slate-500 font-mono text-sm cursor-not-allowed">' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-sm font-bold text-slate-700 mb-1">จำนวนคะแนน (BN) <span class="text-red-500">*</span></label>' +
                        '<input type="number" id="manual-score-points" required placeholder="เช่น 100 (ใส่ค่าติดลบเพื่อหักคะแนน)" class="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-[#31c1d7] outline-none font-bold text-lg text-slate-800 shadow-sm">' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-sm font-bold text-slate-700 mb-1">หมายเหตุ / เหตุผล <span class="text-red-500">*</span></label>' +
                        '<textarea id="manual-score-reason" required rows="2" placeholder="เช่น ย้ายข้อมูลจากระบบเดิม หรือ อ่านหนังสือประจำเดือน..." class="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-[#31c1d7] outline-none custom-scrollbar text-sm shadow-sm"></textarea>' +
                    '</div>' +
                    '<div class="bg-amber-50 p-4 rounded-xl border border-amber-100 flex gap-3">' +
                        '<span class="text-xl">⚠️</span>' +
                        '<p class="text-xs text-amber-700 font-medium leading-relaxed">คะแนนที่บันทึกจะไปแสดงในยอดรวมของเดือนนี้โดยอัตโนมัติ และจะมีการบันทึกประวัติผู้ทำรายการเก็บไว้</p>' +
                    '</div>' +
                '</div>' +
                '<div class="px-6 py-4 bg-white border-t border-slate-100 flex justify-end space-x-3">' +
                    '<button type="button" onclick="closeModals()" class="px-5 py-2.5 bg-slate-50 text-slate-700 font-bold rounded-xl hover:bg-slate-100 transition-colors">ยกเลิก</button>' +
                    '<button type="submit" id="save-manual-score-btn" class="px-6 py-2.5 bg-slate-800 text-white font-bold rounded-xl shadow-sm hover:bg-slate-900 transition-all">บันทึกคะแนน</button>' +
                '</div>' +
            '</form>' +
        '</div>';
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        form = document.getElementById('manual-score-form');
    }
    
    form.reset();
    document.getElementById('manual-score-email').value = email;
    document.getElementById('manual-score-modal').classList.remove('hidden');
}

function saveManualScore(e) {
    e.preventDefault();
    const btn = document.getElementById('save-manual-score-btn');
    btn.disabled = true;
    btn.innerText = 'กำลังบันทึก...';

    const data = {
        email: document.getElementById('manual-score-email').value,
        points: document.getElementById('manual-score-points').value,
        reason: document.getElementById('manual-score-reason').value
    };

    google.script.run
        .withSuccessHandler(function(res) {
            if(res.status === 'success') {
                showAdminToast('เพิ่มคะแนนพิเศษสำเร็จ!');
                closeModals();
                
                google.script.run.withSuccessHandler(function(newData) {
                    if (newData && newData.users) {
                        users = newData.users;
                        renderUsersList();
                    }
                }).getAdminData();
                
                if(typeof loadDashboardData === 'function') loadDashboardData(); 
            } else {
                showAdminToast(res.message, 'error');
            }
            btn.disabled = false;
            btn.innerText = 'บันทึกคะแนน';
        })
        .adminAddManualScore(data);
}

function showUserScoreLog(email) {
    let modal = document.getElementById('user-score-log-modal');
    
    if (!modal) {
        const modalHtml = '<div id="user-score-log-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-[200] flex justify-center items-center p-4 transition-opacity">' +
            '<div class="bg-white rounded-3xl w-full max-w-3xl shadow-xl overflow-hidden max-h-[90vh] flex flex-col">' +
                '<div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-white">' +
                    '<div>' +
                        '<h3 class="text-xl sm:text-2xl font-extrabold text-slate-800">ประวัติคะแนนพิเศษ (Log)</h3>' +
                        '<p id="score-log-user-email" class="text-sm text-indigo-500 font-mono mt-1 bg-indigo-50 px-2 py-0.5 rounded-md inline-block"></p>' +
                    '</div>' +
                    '<button type="button" onclick="closeModals()" class="text-slate-400 hover:text-red-500 bg-slate-50 hover:bg-red-50 rounded-full w-8 h-8 flex items-center justify-center font-bold transition-colors">&times;</button>' +
                '</div>' +
                '<div class="p-6 overflow-y-auto custom-scrollbar flex-grow bg-slate-50/50">' +
                    '<div class="w-full overflow-hidden bg-white rounded-2xl border border-slate-200 shadow-sm">' +
                        '<table class="w-full text-left text-sm whitespace-nowrap">' +
                            '<thead>' +
                                '<tr class="text-slate-500 border-b border-slate-200 bg-slate-50 uppercase text-[10px] tracking-wider">' +
                                    '<th class="py-3 px-4 font-bold">วันที่ / เวลา</th>' +
                                    '<th class="py-3 px-4 font-bold text-center">คะแนน</th>' +
                                    '<th class="py-3 px-4 font-bold">เหตุผล / รายละเอียด</th>' +
                                    '<th class="py-3 px-4 font-bold">ผู้ทำรายการ</th>' +
                                '</tr>' +
                            '</thead>' +
                            '<tbody id="user-score-log-content" class="divide-y divide-slate-100 text-slate-700">' +
                                '<!-- Data injected via JS -->' +
                            '</tbody>' +
                        '</table>' +

        document.body.insertAdjacentHTML('beforeend', modalHtml);
        modal = document.getElementById('user-score-log-modal');

    const content = document.getElementById('user-score-log-content');
    document.getElementById('score-log-user-email').textContent = email;
    
    content.innerHTML = '<tr><td colspan="4" class="py-12 text-center text-slate-500"><svg class="animate-spin h-6 w-6 mx-auto text-[#31c1d7] mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>กำลังดึงประวัติคะแนน...</td></tr>';
    modal.classList.remove('hidden');
    
    google.script.run
        .withSuccessHandler(function(res) {
            if(res.status === 'success') {
                if(res.logs.length === 0) {
                    content.innerHTML = '<tr><td colspan="4" class="py-12 text-center bg-white"><div class="text-4xl mb-3 opacity-20">📭</div><p class="text-slate-400 font-medium">ไม่พบประวัติการให้คะแนนพิเศษ</p></td></tr>';
                } else {
                    let html = '';
                    res.logs.forEach(function(log) {
                        const pts = parseInt(log.points);
                        const ptsClass = pts >= 0 ? 'text-emerald-600 bg-emerald-50 border border-emerald-100' : 'text-rose-600 bg-rose-50 border border-rose-100';
                        const ptsSign = pts >= 0 ? '+' : '';
                        
                        html += '<tr class="hover:bg-slate-50/50 transition-colors">' +
                            '<td class="py-4 px-4 text-slate-500 font-mono text-[11px] whitespace-nowrap">' + escapeHtml(log.timestamp) + '</td>' +
                            '<td class="py-4 px-4 text-center"><span class="px-2.5 py-1 rounded-md font-black text-xs shadow-sm ' + ptsClass + '">' + ptsSign + pts + ' BN</span></td>' +
                            '<td class="py-4 px-4 text-slate-700 text-sm whitespace-normal min-w-[200px] leading-relaxed">' + escapeHtml(log.reason) + '</td>' +
                            '<td class="py-4 px-4 text-slate-400 text-[10px] font-mono whitespace-nowrap">' + escapeHtml(log.adminEmail) + '</td>' +
                        '</tr>';
                    });
                    content.innerHTML = html;
                }
            } else {
                content.innerHTML = '<tr><td colspan="4" class="py-8 text-center text-rose-500 font-bold">❌ เกิดข้อผิดพลาด: ' + escapeHtml(res.message) + '</td></tr>';
            }
        })
        .getUserManualScoreLogs(email);
}
</script>
