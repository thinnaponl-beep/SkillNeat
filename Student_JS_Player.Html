<script>
/* ==========================================
   7. ระบบเล่นวิดีโอ (YouTube Player) & คอร์สภายนอก
========================================== */

// ตัวแปรสำหรับการลากจอเล็ก
let isDraggingMiniPlayer = false;
let dragStartX, dragStartY, initialPlayerLeft, initialPlayerTop;

function dragStartMiniPlayer(e) {
    if (!isMiniPlayer) return;
    isDraggingMiniPlayer = true;
    
    const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
    
    const rect = views.videoPlayer.getBoundingClientRect();
    
    dragStartX = clientX;
    dragStartY = clientY;
    initialPlayerLeft = rect.left;
    initialPlayerTop = rect.top;
    
    // เปลี่ยนจาก CSS right/bottom เป็น left/top แบบตายตัว เพื่อให้ลากได้ไม่กระตุก
    views.videoPlayer.style.bottom = 'auto';
    views.videoPlayer.style.right = 'auto';
    views.videoPlayer.style.left = initialPlayerLeft + 'px';
    views.videoPlayer.style.top = initialPlayerTop + 'px';
}

function dragMiniPlayer(e) {
    if (!isDraggingMiniPlayer || !isMiniPlayer) return;
    
    const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

    let newX = initialPlayerLeft + (clientX - dragStartX);
    let newY = initialPlayerTop + (clientY - dragStartY);

    // ป้องกันการลากหลุดออกนอกขอบจอ
    newX = Math.max(0, Math.min(newX, window.innerWidth - views.videoPlayer.offsetWidth));
    newY = Math.max(0, Math.min(newY, window.innerHeight - views.videoPlayer.offsetHeight));

    views.videoPlayer.style.left = newX + 'px';
    views.videoPlayer.style.top = newY + 'px';
}

function dragEndMiniPlayer(e) {
    isDraggingMiniPlayer = false;
}

// ผูก Event ให้กับแถบลากจอ
function setupMiniPlayerDrag() {
    const dragHandle = document.getElementById('mini-player-drag-handle');
    if (!dragHandle) return;

    dragHandle.addEventListener('mousedown', dragStartMiniPlayer);
    dragHandle.addEventListener('touchstart', dragStartMiniPlayer, {passive: true});

    // ลบ Event เก่าทิ้งก่อนกันการทำงานซ้ำซ้อน
    document.removeEventListener('mousemove', dragMiniPlayer);
    document.removeEventListener('mouseup', dragEndMiniPlayer);
    document.removeEventListener('touchmove', dragMiniPlayer);
    document.removeEventListener('touchend', dragEndMiniPlayer);

    document.addEventListener('mousemove', dragMiniPlayer);
    document.addEventListener('mouseup', dragEndMiniPlayer);
    document.addEventListener('touchmove', dragMiniPlayer, {passive: true});
    document.addEventListener('touchend', dragEndMiniPlayer);
}

function minimizeVideo(backViewStr) {
    const section = currentLesson.sections[currentSectionIndex];
    if(getActualContentType(section) !== 'youtube') {
        closeVideo();
        showView(backViewStr);
        return;
    }
    
    isMiniPlayer = true;
    
    const vp = views.videoPlayer;
    // ปรับโครงสร้าง CSS สำหรับจอเล็ก เพื่อให้ลากและขยายได้
    vp.classList.add('fixed', 'z-[9999]', 'shadow-2xl', 'rounded-2xl', 'overflow-hidden', 'bg-slate-900', 'flex', 'flex-col', 'border-2', 'border-slate-700');
    
    // กำหนดขนาดเริ่มต้น
    vp.style.width = '380px';
    vp.style.height = '240px';
    vp.style.bottom = '24px';
    vp.style.right = '24px';
    vp.style.top = 'auto';
    vp.style.left = 'auto';
    
    // เปิดโหมด CSS Resize ให้ผู้ใช้ดึงมุมขวาล่างขยายเองได้
    vp.style.resize = 'both';
    vp.style.minWidth = '280px';
    vp.style.minHeight = '180px';
    vp.style.maxWidth = '90vw';
    vp.style.maxHeight = '90vh';

    document.getElementById('video-back-btn').classList.add('hidden');
    document.getElementById('video-header').classList.add('hidden');
    
    const wrapper = document.getElementById('video-wrapper');
    wrapper.classList.remove('p-6', 'sm:p-8', 'shadow-xl', 'border', 'border-slate-100', 'bg-white', 'rounded-[2rem]');
    wrapper.classList.add('w-full', 'h-full', 'flex-grow'); 

    const mainContainer = document.getElementById('video-main-container');
    mainContainer.classList.remove('max-w-4xl', 'mx-auto');
    mainContainer.classList.add('w-full', 'h-full');

    const ytContainer = document.getElementById('youtube-aspect-container');
    if (ytContainer) ytContainer.classList.remove('aspect-video'); // เอาอัตราส่วนตายตัวออก เพื่อให้ขยายจอได้อิสระ

    document.getElementById('mini-player-controls').classList.remove('hidden');
    
    const dragHandle = document.getElementById('mini-player-drag-handle');
    if (dragHandle) dragHandle.classList.remove('hidden');
    
    const appContainer = document.getElementById('admin-app') || document.querySelector('.animate-fade-slide-up');
    if (appContainer) {
        appContainer.style.transform = 'none';
        appContainer.style.animation = 'none';
    }
    
    showView(backViewStr);
}

function expandVideo() {
    isMiniPlayer = false;

    const vp = views.videoPlayer;
    vp.classList.remove('fixed', 'z-[9999]', 'shadow-2xl', 'rounded-2xl', 'overflow-hidden', 'bg-slate-900', 'flex', 'flex-col', 'border-2', 'border-slate-700');
    
    // ล้างค่า Style ทั้งหมดที่เกิดจากการลาก หรือ ย่อ/ขยายจอเล็ก
    vp.style.width = '';
    vp.style.height = '';
    vp.style.bottom = '';
    vp.style.right = '';
    vp.style.top = '';
    vp.style.left = '';
    vp.style.resize = '';
    vp.style.minWidth = '';
    vp.style.minHeight = '';
    vp.style.maxWidth = '';
    vp.style.maxHeight = '';

    document.getElementById('video-back-btn').classList.remove('hidden');
    document.getElementById('video-header').classList.remove('hidden');
    
    const wrapper = document.getElementById('video-wrapper');
    wrapper.classList.add('p-6', 'sm:p-8', 'shadow-xl', 'border', 'border-slate-100', 'bg-white', 'rounded-[2rem]');
    wrapper.classList.remove('w-full', 'h-full', 'flex-grow');

    const mainContainer = document.getElementById('video-main-container');
    mainContainer.classList.add('max-w-4xl', 'mx-auto');
    mainContainer.classList.remove('w-full', 'h-full');

    const ytContainer = document.getElementById('youtube-aspect-container');
    if (ytContainer) ytContainer.classList.add('aspect-video'); // ใส่กลับให้จอปกติสัดส่วนสมบูรณ์

    const miniCtrls = document.getElementById('mini-player-controls');
    if (miniCtrls) miniCtrls.classList.add('hidden');
    
    const dragHandle = document.getElementById('mini-player-drag-handle');
    if (dragHandle) dragHandle.classList.add('hidden');

    showView('videoPlayer');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeVideo() {
    isMiniPlayer = false;

    // บังคับเซฟเวลาดูวิดีโอล่าสุดทันทีที่กดปิดหรือซ่อนวิดีโอ
    if (player && typeof player.getCurrentTime === 'function') {
        saveVideoProgress();
    }

    if (player && typeof player.destroy === 'function') {
        player.destroy();
        player = null;
    }
    if (progressSaveTimeout) { clearInterval(progressSaveTimeout); progressSaveTimeout = null; }
    if (videoTrackerInterval) { clearInterval(videoTrackerInterval); videoTrackerInterval = null; }
    
    currentExternalProofBase64 = null;
    currentExternalProofMimeType = null;
    
    views.videoPlayer.classList.remove('fixed', 'z-[9999]', 'shadow-2xl', 'rounded-2xl', 'overflow-hidden', 'bg-slate-900', 'flex', 'flex-col', 'border-2', 'border-slate-700');
    views.videoPlayer.style.width = '';
    views.videoPlayer.style.height = '';
    views.videoPlayer.classList.add('hidden');
    views.videoPlayer.innerHTML = '';
}

function togglePlayPause() {
    if (player && typeof player.getPlayerState === 'function') {
        const state = player.getPlayerState();
        const ppIcon = document.getElementById('play-pause-icon');
        if (state === YT.PlayerState.PLAYING) {
            player.pauseVideo();
            if (ppIcon) ppIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>'; 
        } else {
            player.playVideo();
            if (ppIcon) ppIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>'; 
        }
    }
}

// ลบฟังก์ชันเปลี่ยนความเร็วเดิมทิ้งไป ปล่อยให้ปรับในฟันเฟือง Youtube อย่างเดียวได้เลย
function changeVideoSpeed(rate) {
    if (player && typeof player.setPlaybackRate === 'function') {
        player.setPlaybackRate(parseFloat(rate));
        
        const state = player.getPlayerState();
        if (state !== YT.PlayerState.PLAYING) {
            player.playVideo();
        }
    }
}

function loadYouTubePlayer(videoId, startSeconds) {
    if (typeof YT === 'undefined' || typeof YT.Player === 'undefined') {
        setTimeout(function() { loadYouTubePlayer(videoId, startSeconds); }, 500); return;
    }
    player = new YT.Player('player', {
        height: '100%', width: '100%', videoId: videoId,
        playerVars: { 'autoplay': 1, 'start': startSeconds, 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
        events: { 
            'onReady': onPlayerReady, 
            'onStateChange': onPlayerStateChange,
            'onPlaybackRateChange': onPlaybackRateChange
        }
    });
}

function onPlayerReady(event) { }

// JAVIS REFACTORED: อนุญาตให้ผู้เรียนปรับความเร็วผ่านปุ่มบน UI ที่เราทำไว้ หรือบนฟันเฟืองของ YouTube ก็ได้
function onPlaybackRateChange(event) {
    const speedSelect = document.getElementById('video-speed-select');
    if (speedSelect) {
        speedSelect.value = event.data; // Sync ค่าใน UI ของเราให้ตรงกับที่ YouTube ปรับ
    }
}

function onPlayerStateChange(event) {
    const ppIcon = document.getElementById('play-pause-icon');
    if (event.data == YT.PlayerState.PLAYING || event.data == YT.PlayerState.BUFFERING) checkVideoSkip();
    if (event.data == YT.PlayerState.PLAYING) {
        if (progressSaveTimeout) clearInterval(progressSaveTimeout);
        progressSaveTimeout = setInterval(saveVideoProgress, 10000); 
        if (!videoTrackerInterval) videoTrackerInterval = setInterval(checkVideoSkip, 500);
        if (ppIcon) ppIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
    } else {
        // บังคับเซฟเวลาดูล่าสุดทันทีเมื่อกดหยุด (Pause) หรือวิดีโอสะดุด
        if (event.data == YT.PlayerState.PAUSED) {
            saveVideoProgress();
        }
        
        if (progressSaveTimeout) clearInterval(progressSaveTimeout);
        if (event.data == YT.PlayerState.PAUSED && ppIcon) ppIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
    }
    if (event.data == YT.PlayerState.ENDED) {
        if (videoTrackerInterval) { clearInterval(videoTrackerInterval); videoTrackerInterval = null; }
        showVideoEndedMessage();
    }
}

// JAVIS REFACTORED: ปรับเพิ่ม Threshold เป็น +3 วิ เพื่อรองรับจังหวะที่ผู้ใช้อาจเล่นวิดีโอด้วยความเร็ว 2x 
function checkVideoSkip() {
    if (player && typeof player.getCurrentTime === 'function') {
        const currentTime = player.getCurrentTime();
        const section = currentLesson.sections[currentSectionIndex];
        const sectionIdSafe = String(section.SectionID).trim();
        const isAlreadyCompleted = userInfo.progress.some(function(id) { return String(id).trim() === sectionIdSafe; });
        const isSuperAdminUser = document.querySelector('a[data-page="superadmin"]') !== null;
        
        if (isSuperAdminUser || isAlreadyCompleted) {
            if (currentTime > maxTimeWatched) maxTimeWatched = currentTime;
            return;
        }

        // ปรับเป็น maxTimeWatched + 3 เพื่อความยืดหยุ่นในการดู 2x
        if (currentTime > maxTimeWatched + 3) {
            player.seekTo(maxTimeWatched); 
            if(typeof showToast !== 'undefined') showToast('ไม่อนุญาตให้กรอวิดีโอข้ามเนื้อหาครับ 🚫', 'error');
        } else {
            if (currentTime > maxTimeWatched) maxTimeWatched = currentTime;
        }
    }
}

function saveVideoProgress() {
    if (player && typeof player.getCurrentTime === 'function' && currentLesson && currentLesson.sections) {
        const section = currentLesson.sections[currentSectionIndex];
        if (section) {
            const sectionId = section.SectionID;
            
            // บังคับให้เวลาขั้นต่ำที่เซฟคือ 1 วินาที ป้องกันการเซฟ 0 ทับของเดิมเมื่อกดปิดทันที
            const currentTimeToSave = Math.max(1, Math.floor(maxTimeWatched));
            
            // อัปเดตเวลาลงในหน่วยความจำของหน้าเว็บ (RAM) ทันที! 
            section.latestTimestamp = currentTimeToSave;
            currentLesson.isStarted = true; // ยืนยันสถานะว่าเรียนแล้ว
            
            google.script.run
                .withFailureHandler(function(err){ console.error('Save Video Error:', err); })
                .withSuccessHandler(function(res){ if(res && res.status==='error') console.error('Backend Save Error:', res.message); })
                .updateLatestTimestamp({ sectionId: sectionId, timestamp: currentTimeToSave });
        }
    }
}

    let html = '<div class="w-16 h-16 sm:w-20 sm:h-20 bg-emerald-500 rounded-full flex items-center justify-center mb-4 sm:mb-6 shadow-lg shadow-emerald-500/30"><svg class="w-8 h-8 sm:w-10 sm:h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>' +

    else html += '<div class="inline-flex items-center px-4 py-2 bg-slate-800 text-slate-300 rounded-xl mb-6 shadow-sm"><span class="font-bold text-sm">คุณเคยได้รับคะแนนจากเนื้อหานี้แล้ว</span></div>';
        
    html += '<p class="text-slate-300 mb-8 text-sm sm:text-lg">คุณทำได้ยอดเยี่ยมมาก</p>' +
        '<div class="flex flex-col sm:flex-row gap-3 sm:gap-4 w-full max-w-sm mx-auto justify-center flex-wrap">';
        
    const safeLessonIdStr = escapeJsString(currentLesson.LessonID);
    const hasCert = currentLesson.HasCertificate === true || currentLesson.HasCertificate === 'TRUE' || String(currentLesson.HasCertificate).toLowerCase() === 'true';

    // JAVIS FIX: ฝังโค้ด closeVideo() เข้าไปในทุกๆ ปุ่มเพื่อให้การทำงานถูกรีเซ็ตใหม่เสมอ
    if (section.hasQuiz) {
        html += '<button onclick="closeVideo(); startQuiz()" class="w-full px-6 py-3 sm:py-4 bg-[#31c1d7] text-white font-bold rounded-xl sm:rounded-2xl hover:bg-[#1eb0c6] transition-all shadow-lg shadow-[#31c1d7]/30 text-base sm:text-lg">เริ่มทำแบบทดสอบ</button>';
    } else {
        if (currentSectionIndex < currentLesson.sections.length - 1) {
            html += '<button onclick="closeVideo(); playSection(\'' + safeLessonIdStr + '\', ' + (currentSectionIndex + 1) + ')" class="w-full px-6 py-3 sm:py-4 bg-[#31c1d7] text-white font-bold rounded-xl sm:rounded-2xl hover:bg-[#1eb0c6] transition-all shadow-lg text-base sm:text-lg">เรียนบทถัดไป</button>';
        } else {

            if (lessonStats.isCompleted && hasCert) html += '<button onclick="downloadCertificate(\'' + safeLessonIdStr + '\')" class="w-full px-6 py-3 sm:py-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl sm:rounded-2xl transition-all text-lg shadow-lg mb-2">🎓 ดูตัวอย่างใบประกาศ</button>';
            html += '<button onclick="closeVideo(); showView(\'lessonList\'); if(typeof renderLessonList === \'function\') renderLessonList(); if(typeof renderMyCourses === \'function\') renderMyCourses();" class="w-full px-6 py-3 sm:py-4 bg-[#31c1d7] text-white font-bold rounded-xl sm:rounded-2xl hover:bg-[#1eb0c6] transition-all shadow-lg text-base sm:text-lg">กลับหน้าหลัก</button>';

}

function handleExternalProofUpload(event) {
    const file = event.target.files[0];
    if (file) {
        if (file.size > 5 * 1024 * 1024) { showToast('ขนาดไฟล์รูปภาพใหญ่เกินไป (ไม่เกิน 5MB)', 'error'); return; }
        currentExternalProofMimeType = file.type;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('external-proof-img').src = e.target.result;
            currentExternalProofBase64 = e.target.result.split(',')[1];
            document.getElementById('external-proof-placeholder').classList.add('hidden');
            document.getElementById('external-proof-preview').classList.remove('hidden');
            document.getElementById('external-proof-preview').classList.add('flex');
            document.getElementById('btn-submit-proof').classList.remove('hidden');
            document.getElementById('btn-submit-proof').disabled = false;
        };
        reader.readAsDataURL(file);
    }
}

function submitExternalProof() {
    if (!currentExternalProofBase64) return;
    const btn = document.getElementById('btn-submit-proof');
    btn.disabled = true;
    btn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังส่งหลักฐาน...';
    
    const payload = {
        sectionId: String(currentLesson.sections[currentSectionIndex].SectionID).trim(),
        imageData: currentExternalProofBase64,
        imageMimeType: currentExternalProofMimeType
    };
    
    google.script.run.withSuccessHandler(function(res) {
        if (res.status === 'success') {
            showToast('ส่งหลักฐานเรียบร้อย รอแอดมินตรวจ!', 'success');
            google.script.run.withSuccessHandler(function(newData) {
                if(newData) {
                   studentData.userInfo = newData.userInfo;
                   lessons.length = 0;
                   newData.lessons.forEach(function(l){ lessons.push(l); });
                   currentLesson = lessons.find(function(l){ return l.LessonID === currentLesson.LessonID; });
                   playSection(currentLesson.LessonID, currentSectionIndex); 
                }
            }).getStudentData();
        } else {
            showToast('เกิดข้อผิดพลาด: ' + res.message, 'error');
            btn.disabled = false;
            btn.innerHTML = 'ส่งหลักฐานให้แอดมินตรวจสอบ';
        }
    }).withFailureHandler(function(err) {
        showToast('การเชื่อมต่อล้มเหลว', 'error');
        btn.disabled = false;
        btn.innerHTML = 'ส่งหลักฐานให้แอดมินตรวจสอบ';
    }).submitExternalProof(payload);
}

/* ==========================================
   8. ระบบแบบทดสอบ (Quiz)
========================================== */
function startQuizDirectly(lessonId, sectionIndex) {
    if(typeof closeLessonDetailsModal === 'function') closeLessonDetailsModal();
    if (isMiniPlayer) closeVideo();
    currentLesson = lessons.find(function(l) { return l.LessonID === lessonId; });
    currentSectionIndex = sectionIndex;
    startQuiz();
}

function startQuiz() {
    const section = currentLesson.sections[currentSectionIndex];
    views.quiz.innerHTML = '<div class="text-center py-20"><svg class="animate-spin h-10 w-10 text-[#31c1d7] mx-auto mb-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><p class="text-slate-500 font-bold">กำลังโหลดข้อสอบ...</p></div>';
    showView('quiz');
    
    google.script.run.withSuccessHandler(function(questions) {
        quizQuestions = questions;
        quizAnswers = new Array(questions.length).fill(null);
        renderQuiz();
    }).getQuiz(section.SectionID);
}

function renderQuiz() {
    if (!quizQuestions || quizQuestions.length === 0) {
        views.quiz.innerHTML = '<div class="bg-white p-12 rounded-[2rem] shadow-xl text-center max-w-2xl mx-auto"><p class="text-slate-500 mb-6 font-medium text-lg">ไม่พบข้อสอบสำหรับบทเรียนนี้</p><button onclick="showView(\'lessonList\')" class="px-6 py-3 bg-[#31c1d7] text-white font-bold rounded-xl hover:bg-[#1eb0c6]">กลับหน้าหลัก</button></div>';
        return;
    }

    const safeLessonId = escapeJsString(currentLesson.LessonID);
    let html = '<div class="max-w-3xl mx-auto bg-white rounded-[2rem] shadow-xl overflow-hidden border border-slate-100"><div class="bg-[#31c1d7] px-8 py-6 text-white"><h2 class="text-2xl font-black mb-1">แบบทดสอบ</h2><p class="opacity-90 font-medium">ทดสอบความเข้าใจจากเนื้อหา</p></div><div class="p-8 sm:p-10 space-y-10">';

    quizQuestions.forEach(function(q, idx) {
        html += '<div class="quiz-item"><h3 class="text-[17px] font-bold text-slate-800 mb-5 leading-relaxed"><span class="text-[#31c1d7] mr-2">' + (idx + 1) + '.</span>' + escapeHtml(q.question) + '</h3>';
        if (q.options && q.options.length > 0) {
            html += '<div class="space-y-3">';
            q.options.forEach(function(opt) {
                const btnClass = quizAnswers[idx] === opt ? 'border-[#31c1d7] bg-[#31c1d7]/5 text-[#31c1d7] shadow-sm' : 'text-slate-600 hover:border-slate-300';
                html += '<button onclick="selectOption(' + idx + ', \'' + escapeJsString(opt) + '\')" class="w-full text-left px-6 py-4 rounded-xl border-2 ' + btnClass + ' font-medium transition-all text-[15px]">' + escapeHtml(opt) + '</button>';
            });
            html += '</div>';
        } else {
            html += '<input type="text" id="subjective-ans-' + idx + '" onchange="selectOption(' + idx + ', this.value)" value="' + escapeHtml(quizAnswers[idx] || '') + '" placeholder="พิมพ์คำตอบของคุณที่นี่..." class="w-full px-6 py-4 rounded-xl border-2 border-slate-200 focus:border-[#31c1d7] outline-none transition-colors font-medium text-[15px] text-slate-700">';
        }
        html += '</div>';
    });

    html += '</div><div class="px-8 py-6 bg-slate-50 border-t border-slate-100 flex justify-between items-center"><button onclick="closeVideo(); playSection(\'' + safeLessonId + '\', ' + currentSectionIndex + ')" class="text-slate-500 font-bold hover:text-slate-800 transition-colors">กลับไปดูเนื้อหา</button><button onclick="submitQuiz()" class="px-8 py-3.5 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-900 transition-all shadow-md">ส่งคำตอบ</button></div></div>';
    views.quiz.innerHTML = html;
}

function selectOption(qIndex, answerValue) {
    quizAnswers[qIndex] = answerValue.trim();
    if (quizQuestions[qIndex].options && quizQuestions[qIndex].options.length > 0) renderQuiz(); 
}

function submitQuiz() {
    if (quizAnswers.some(function(a) { return a === null || a === ''; })) { showToast('กรุณาตอบคำถามให้ครบทุกข้อ', 'error'); return; }

    let score = 0;
    const total = quizQuestions.length;
    quizQuestions.forEach(function(q, idx) {
        const userAns = quizAnswers[idx].toLowerCase();
        if (q.answer.toLowerCase().split(',').map(s => s.trim()).filter(Boolean).some(ans => userAns === ans || userAns.includes(ans))) score++;
    });

    const section = currentLesson.sections[currentSectionIndex];
    const scoreData = { sectionId: String(section.SectionID).trim(), score: score, totalQuestions: total };
    const alreadyPassed = section.quizScore && (section.quizScore.Score / section.quizScore.TotalQuestions) >= 0.5;

    views.quiz.innerHTML = '<div class="text-center py-20"><svg class="animate-spin h-10 w-10 text-[#31c1d7] mx-auto mb-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><p class="text-slate-500 font-bold">กำลังประมวลผล...</p></div>';

    google.script.run.withSuccessHandler(function(response) {
        if (response.status === 'success') {
            if (response.passed) {
                section.quizScore = { Score: score, TotalQuestions: total };
                if (!alreadyPassed) {
                    let qp = parseInt(section.QuizPoints, 10); if (isNaN(qp)) qp = 50;
                    userInfo.totalBN = (parseInt(userInfo.totalBN, 10) || 0) + qp;
                    cachedLeaderboardData = { 'current_month': null, 'all': null };
                    if(typeof fetchHomeLeaderboard === 'function') fetchHomeLeaderboard(true);
                    if (typeof window.updateNavbarRank === 'function') window.updateNavbarRank(null, qp);
                }
            }
            showQuizResult(score, total, response.passed, !alreadyPassed);
        }
    }).saveQuizScore(scoreData);
}

function showQuizResult(score, total, passed, isNewPass) {
    const percent = Math.round((score / total) * 100);
    const section = currentLesson.sections[currentSectionIndex];
    let qp = parseInt(section.QuizPoints, 10); if (isNaN(qp)) qp = 50;
    
    let icon, title, desc, btnClass, btnText;

    if (passed) {
        icon = '<div class="w-24 h-24 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><svg class="w-12 h-12 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>';
        title = '<h2 class="text-3xl font-black text-slate-800 mb-2">สอบผ่าน! เยี่ยมมาก</h2>';
        if (isNewPass) desc = '<div class="inline-flex items-center px-4 py-2 bg-violet-50 text-violet-600 border border-violet-200 rounded-xl mb-4 shadow-sm"><span class="text-xl mr-2">🎁</span><span class="font-bold">ได้รับโบนัสข้อสอบ +' + qp + ' BN</span></div><p class="text-slate-500 text-lg">คุณทำคะแนนได้ดีมาก ความรู้แน่นเปรี๊ยะ</p>';
        else desc = '<div class="inline-flex items-center px-4 py-2 bg-slate-800 text-slate-300 rounded-xl mb-4 shadow-sm"><span class="font-bold text-sm">คุณเคยรับโบนัสจากแบบทดสอบนี้ไปแล้ว</span></div><p class="text-slate-500 text-lg">เก่งมากที่กลับมาทบทวนความรู้</p>';
        btnClass = 'bg-[#31c1d7] hover:bg-[#1eb0c6] shadow-lg shadow-[#31c1d7]/30';
        btnText = 'กลับหน้าหลัก';
    } else {
        icon = '<div class="w-24 h-24 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><svg class="w-12 h-12 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg></div>';
        title = '<h2 class="text-3xl font-black text-slate-800 mb-2">เกือบผ่านแล้ว!</h2>';
        desc = '<p class="text-slate-500 text-lg">ทบทวนเนื้อหาอีกนิด แล้วลองใหม่นะ</p>';
        btnClass = 'bg-slate-800 hover:bg-slate-900 shadow-lg';
        btnText = 'ทบทวนเนื้อหา & สอบใหม่';
    }

    let html = '<div class="max-w-lg mx-auto bg-white rounded-[2rem] shadow-xl p-10 text-center border border-slate-100 animate-fade-slide-up">' +
        icon + title + desc + '<div class="my-8 p-6 bg-slate-50 rounded-2xl border border-slate-100"><div class="text-5xl font-black ' + (passed ? 'text-emerald-500' : 'text-rose-500') + ' mb-2">' + percent + '%</div><div class="text-sm font-bold text-slate-400 uppercase tracking-widest">คะแนน ' + score + ' / ' + total + '</div></div>';

    const safeLessonId = escapeJsString(currentLesson.LessonID);
    const hasCert = currentLesson.HasCertificate === true || currentLesson.HasCertificate === 'TRUE' || String(currentLesson.HasCertificate).toLowerCase() === 'true';
    
    if (passed) {
        if (getLessonProgressStats(currentLesson).isCompleted && hasCert) html += '<button onclick="downloadCertificate(\'' + safeLessonId + '\')" class="w-full px-6 py-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl transition-all text-lg shadow-lg mb-3">🎓 ดาวน์โหลดใบประกาศ</button>';
        html += '<button onclick="closeVideo(); showView(\'lessonList\'); if(typeof renderLessonList === \'function\') renderLessonList(); if(typeof renderMyCourses === \'function\') renderMyCourses();" class="w-full px-6 py-4 ' + btnClass + ' text-white font-bold rounded-xl transition-all text-lg">' + btnText + '</button>';
    } else {
        html += '<button onclick="closeVideo(); playSection(\'' + safeLessonId + '\', ' + currentSectionIndex + ')" class="w-full px-6 py-4 ' + btnClass + ' text-white font-bold rounded-xl transition-all text-lg">' + btnText + '</button>';
    }
    
    html += '</div>';
    views.quiz.innerHTML = html;
}
</script>
